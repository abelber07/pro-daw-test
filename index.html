<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PRO·Test Java</title>
<style>
:root {
  --bg: #0b0d17;
  --bg2: #12152a;
  --card: rgba(255,255,255,0.045);
  --card-hi: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.09);
  --text: #eef0fa;
  --muted: #9aa0bd;
  --faint: #6b7192;
  --accent: #8b6cff;
  --accent2: #22d3ee;
  --good: #22c55e;
  --good-bg: rgba(34,197,94,0.13);
  --bad: #f43f5e;
  --bad-bg: rgba(244,63,94,0.13);
  --warn: #f59e0b;
  --code-bg: #0e1122;
  --code-border: rgba(139,108,255,0.22);
  --shadow: 0 10px 40px rgba(0,0,0,0.45);
  --tk-k: #c792ea; --tk-t: #82aaff; --tk-s: #c3e88d; --tk-n: #f78c6c; --tk-c: #6b7192; --tk-f: #ffcb6b;
  --ring-track: rgba(255,255,255,0.08);
  --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Code", "Cascadia Mono", Consolas, "SF Mono", Menlo, "Courier New", monospace;
}
:root[data-theme="light"] {
  --bg: #f4f5fb; --bg2: #e9ebf7; --card: rgba(255,255,255,0.85); --card-hi: #ffffff;
  --border: rgba(20,24,60,0.10); --text: #141833; --muted: #555b7c; --faint: #8a8fab;
  --accent: #6d4aff; --accent2: #0891b2; --good: #15803d; --good-bg: rgba(21,128,61,0.10);
  --bad: #e11d48; --bad-bg: rgba(225,29,72,0.09); --code-bg: #1b1e33; --code-border: rgba(109,74,255,0.25);
  --shadow: 0 10px 30px rgba(20,24,60,0.10); --ring-track: rgba(20,24,60,0.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font); color: var(--text); background: var(--bg);
  min-height: 100vh; -webkit-font-smoothing: antialiased; line-height: 1.5;
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background:
    radial-gradient(900px 600px at 8% -10%, rgba(139,108,255,0.22), transparent 60%),
    radial-gradient(800px 500px at 100% 0%, rgba(34,211,238,0.14), transparent 60%),
    radial-gradient(700px 700px at 50% 120%, rgba(244,63,94,0.08), transparent 60%);
}
:root[data-theme="light"] body::before { opacity: 0.6; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
code.ic {
  font-family: var(--mono); font-size: 0.88em; padding: 0.08em 0.4em; border-radius: 6px;
  background: rgba(139,108,255,0.14); color: var(--text); border: 1px solid rgba(139,108,255,0.22);
  white-space: pre-wrap;
}
.wrap { max-width: 1080px; margin: 0 auto; padding: 22px 16px 60px; }

/* top bar */
.topbar { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo-mark {
  width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--accent), var(--accent2)); box-shadow: 0 6px 24px rgba(139,108,255,0.45);
  font-family: var(--mono); font-weight: 800; font-size: 17px; color: #fff; letter-spacing: -1px;
}
.logo h1 { font-size: 20px; margin: 0; letter-spacing: -0.3px; }
.logo p { margin: 0; font-size: 12.5px; color: var(--muted); }
.spacer { flex: 1; }
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center;
  background: var(--card); border: 1px solid var(--border); transition: .2s;
}
.icon-btn:hover { background: var(--card-hi); transform: translateY(-1px); }
.icon-btn svg { width: 19px; height: 19px; }

/* stats strip */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
.stat {
  background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 16px;
  backdrop-filter: blur(12px);
}
.stat b { display: block; font-size: 24px; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--muted); }

/* hero */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 28px; margin-bottom: 22px;
  background: linear-gradient(135deg, rgba(139,108,255,0.30), rgba(34,211,238,0.16));
  border: 1px solid rgba(139,108,255,0.35); box-shadow: var(--shadow);
  display: grid; grid-template-columns: 1.3fr 1fr; gap: 24px; align-items: center;
}
.hero::after {
  content: "{ }"; position: absolute; right: -10px; top: -40px; font-family: var(--mono);
  font-size: 220px; font-weight: 800; color: rgba(255,255,255,0.05); pointer-events: none;
}
.hero h2 { margin: 0 0 6px; font-size: 28px; letter-spacing: -0.6px; }
.hero p { margin: 0 0 16px; color: var(--muted); max-width: 520px; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  font-size: 12px; padding: 5px 10px; border-radius: 999px; background: var(--card);
  border: 1px solid var(--border); color: var(--muted); white-space: nowrap;
}
.chip.ok { color: var(--good); border-color: rgba(34,197,94,0.35); background: var(--good-bg); }
.hero-box {
  position: relative; z-index: 1; background: rgba(0,0,0,0.22); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px;
}
:root[data-theme="light"] .hero-box { background: rgba(255,255,255,0.6); }
.hero-box label { font-size: 12.5px; color: var(--muted); display: block; margin-bottom: 8px; }
.seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; margin-bottom: 14px; }
.seg button { flex: 1; padding: 8px 0; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); transition: .2s; }
.seg button.on { background: var(--accent); color: #fff; box-shadow: 0 4px 14px rgba(139,108,255,0.45); }
.toggle, .hero-box .toggle { display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--muted); margin-bottom: 14px; cursor: pointer; user-select: none; }
.toggle input { display: none; }
.toggle .sw { width: 38px; height: 22px; border-radius: 99px; background: var(--card-hi); border: 1px solid var(--border); position: relative; transition: .2s; flex: none; }
.toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: .2s; }
.toggle input:checked + .sw { background: var(--accent); border-color: var(--accent); }
.toggle input:checked + .sw::after { left: 18px; background: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 12px 20px; border-radius: 13px; font-weight: 650; font-size: 15px; transition: .18s;
  background: var(--card-hi); border: 1px solid var(--border);
}
.btn:hover { transform: translateY(-1px); }
.btn.primary { background: linear-gradient(135deg, var(--accent), #6a4cf0); color: #fff; border: 0; box-shadow: 0 8px 24px rgba(139,108,255,0.45); }
.btn.primary:hover { box-shadow: 0 10px 30px rgba(139,108,255,0.6); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }

/* sections */
.sec-title { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 14px; }
.sec-title h3 { margin: 0; font-size: 18px; letter-spacing: -0.3px; }
.sec-title span { color: var(--faint); font-size: 13px; }

.modes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.mode {
  text-align: left; padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--border);
  transition: .2s; position: relative; overflow: hidden; min-height: 132px; display: flex; flex-direction: column;
}
.mode:hover { background: var(--card-hi); transform: translateY(-2px); border-color: rgba(139,108,255,0.4); }
.mode .ico { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; margin-bottom: 10px; }
.mode b { font-size: 15.5px; }
.mode small { color: var(--muted); font-size: 12.8px; margin-top: 3px; }
.mode .badge { position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--bad-bg); color: var(--bad); }
.mode:disabled { opacity: .5; }

.tests { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.tcard {
  padding: 14px 12px; border-radius: 15px; background: var(--card); border: 1px solid var(--border);
  text-align: center; transition: .2s;
}
.tcard:hover { background: var(--card-hi); transform: translateY(-2px); }
.tcard .n { font-size: 12px; color: var(--muted); }
.tcard .big { font-size: 22px; font-weight: 750; letter-spacing: -0.5px; }
.tcard .best { font-size: 12px; margin-top: 2px; color: var(--faint); }
.tcard .best.g { color: var(--good); } .tcard .best.m { color: var(--warn); } .tcard .best.b { color: var(--bad); }

.topics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.topic {
  display: grid; grid-template-columns: 46px 1fr auto; gap: 14px; align-items: center;
  padding: 14px 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); transition: .2s;
}
.topic:hover { background: var(--card-hi); }
.topic .ico { width: 46px; height: 46px; border-radius: 13px; display: grid; place-items: center; font-size: 22px; }
.topic b { font-size: 15px; display: block; }
.topic small { color: var(--muted); font-size: 12.5px; }
.bar { height: 6px; border-radius: 99px; background: var(--ring-track); overflow: hidden; margin-top: 7px; }
.bar i { display: block; height: 100%; border-radius: 99px; transition: width .6s; }
.topic .acts { display: flex; flex-direction: column; gap: 6px; }
.mini { font-size: 12.5px; font-weight: 650; padding: 6px 11px; border-radius: 10px; background: var(--card-hi); border: 1px solid var(--border); white-space: nowrap; transition: .15s; }
.mini:hover { border-color: var(--accent); color: var(--accent); }
.mini.p { background: var(--accent); color: #fff; border-color: transparent; }
.mini.p:hover { color: #fff; filter: brightness(1.1); }

.foot { margin-top: 36px; color: var(--faint); font-size: 12.5px; text-align: center; }
.foot a { color: var(--muted); cursor: pointer; text-decoration: underline; }

/* ---------- quiz ---------- */
.qtop { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.qtop .title { font-weight: 700; font-size: 15px; }
.qtop .sub { color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 11px; background: var(--card); border: 1px solid var(--border); font-size: 13.5px; font-variant-numeric: tabular-nums; font-weight: 600; }
.progress { height: 7px; border-radius: 99px; background: var(--ring-track); overflow: hidden; margin-bottom: 20px; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width .35s ease; }
.dots { display: flex; flex-wrap: wrap; gap: 5px; margin: -8px 0 18px; }
.dots button { width: 26px; height: 26px; border-radius: 8px; font-size: 11.5px; font-weight: 700; background: var(--card); border: 1px solid var(--border); color: var(--muted); }
.dots button.ans { background: rgba(139,108,255,0.22); color: var(--text); border-color: rgba(139,108,255,0.4); }
.dots button.cur { outline: 2px solid var(--accent); outline-offset: 1px; color: var(--text); }

.qcard {
  background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 24px;
  box-shadow: var(--shadow); backdrop-filter: blur(14px);
}
.qcard.anim { animation: pop .32s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }
.qmeta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
.tag { font-size: 12px; font-weight: 650; padding: 4px 10px; border-radius: 99px; }
.tag.type { background: var(--card-hi); border: 1px solid var(--border); color: var(--muted); }
.tag.gen { background: rgba(34,211,238,0.14); color: var(--accent2); border: 1px solid rgba(34,211,238,0.3); }
.star { margin-left: auto; width: 36px; height: 36px; border-radius: 11px; display: grid; place-items: center; border: 1px solid var(--border); background: var(--card); transition: .2s; }
.star svg { width: 18px; height: 18px; }
.star.on { color: #fbbf24; border-color: rgba(251,191,36,0.5); background: rgba(251,191,36,0.12); }
.qtext { font-size: 18.5px; font-weight: 600; line-height: 1.45; margin: 0 0 16px; letter-spacing: -0.2px; }

.code {
  background: var(--code-bg); border: 1px solid var(--code-border); border-radius: 15px; overflow: hidden;
  margin-bottom: 14px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.code .bar-top { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.code .bar-top i { width: 10px; height: 10px; border-radius: 50%; display: block; }
.code .bar-top span { margin-left: 8px; font-family: var(--mono); font-size: 12px; color: #6b7192; }
.code pre { margin: 0; padding: 12px 0; overflow-x: auto; font-family: var(--mono); font-size: 14px; line-height: 1.62; color: #e6e8f5; }
.code .ln { display: flex; padding-right: 16px; }
.code .ln .no { width: 42px; flex: none; text-align: right; padding-right: 14px; color: #4a4f6e; user-select: none; }
.code .ln .tx { white-space: pre; }
.tk-k { color: var(--tk-k); } .tk-t { color: var(--tk-t); } .tk-s { color: var(--tk-s); } .tk-n { color: var(--tk-n); } .tk-c { color: var(--tk-c); font-style: italic; } .tk-f { color: var(--tk-f); }
.blank { background: rgba(245,158,11,0.18); color: #fbbf24; border: 1px dashed rgba(245,158,11,0.7); border-radius: 6px; padding: 0 6px; }
.input-box { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: var(--muted); margin: -4px 0 16px; padding: 10px 14px; border-radius: 12px; background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.22); }
.input-box code { font-family: var(--mono); color: var(--accent2); font-weight: 600; }

.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; text-align: left;
  padding: 13px 14px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--border);
  transition: background .15s, border-color .15s, transform .15s; font-size: 15.5px;
}
.opt:hover:not(:disabled) { border-color: rgba(139,108,255,0.6); background: var(--card-hi); transform: translateX(2px); }
.opt .k { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 750; font-size: 14px; background: var(--card-hi); border: 1px solid var(--border); color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; }
.opt .t.mono { font-family: var(--mono); font-size: 14.2px; white-space: pre-wrap; }
.opt.sel { border-color: var(--accent); background: rgba(139,108,255,0.14); }
.opt.sel .k { background: var(--accent); color: #fff; border-color: transparent; }
.opt.right { border-color: var(--good); background: var(--good-bg); }
.opt.right .k { background: var(--good); color: #fff; border-color: transparent; }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake .35s; }
.opt.wrong .k { background: var(--bad); color: #fff; border-color: transparent; }
.opt:disabled { cursor: default; }
.opt .mark { font-size: 18px; font-weight: 800; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }

.feedback { margin-top: 16px; border-radius: 16px; padding: 16px 18px; animation: pop .3s ease; }
.feedback.good { background: var(--good-bg); border: 1px solid rgba(34,197,94,0.35); }
.feedback.bad { background: var(--bad-bg); border: 1px solid rgba(244,63,94,0.35); }
.feedback h4 { margin: 0 0 6px; font-size: 15.5px; }
.feedback.good h4 { color: var(--good); } .feedback.bad h4 { color: var(--bad); }
.feedback p { margin: 0; color: var(--text); font-size: 14.5px; }
.qnav { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
.kbd-hint { color: var(--faint); font-size: 12px; margin-left: auto; }
.kbd-hint kbd { font-family: var(--mono); font-size: 11px; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--border); background: var(--card); }

/* ---------- results ---------- */
.res-hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; background: var(--card); border: 1px solid var(--border); border-radius: 24px; padding: 26px; box-shadow: var(--shadow); margin-bottom: 18px; animation: pop .4s; }
.ring { position: relative; width: 168px; height: 168px; }
.ring svg { transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .val b { font-size: 42px; letter-spacing: -1.5px; line-height: 1; display: block; }
.ring .val span { font-size: 12.5px; color: var(--muted); }
.res-hero h2 { margin: 0 0 6px; font-size: 26px; letter-spacing: -0.5px; }
.res-hero p { margin: 0 0 14px; color: var(--muted); }
.res-stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px; }
.res-stats .pill b { font-size: 15px; }
.breakdown { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 18px; }
.bd { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; }
.bd .row { display: flex; justify-content: space-between; font-size: 13.5px; }
.bd .row span { color: var(--muted); }
.review { display: grid; gap: 10px; }
.rv { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
.rv summary { list-style: none; display: grid; grid-template-columns: 30px 1fr auto; gap: 12px; align-items: center; padding: 13px 16px; cursor: pointer; }
.rv summary::-webkit-details-marker { display: none; }
.rv .st { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; font-weight: 800; color: #fff; }
.rv .st.g { background: var(--good); } .rv .st.b { background: var(--bad); } .rv .st.n { background: var(--faint); }
.rv .qq { font-size: 14.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv .body { padding: 0 16px 16px; }
.rv .ans { display: grid; gap: 6px; margin: 10px 0; font-size: 14px; }
.rv .ans div { padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; }
.rv .ans .yours { background: var(--bad-bg); }
.rv .ans .corr { background: var(--good-bg); }
.rv .exp { color: var(--muted); font-size: 14px; margin: 0; }
.mono { font-family: var(--mono); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(5,6,14,0.6); backdrop-filter: blur(6px); display: grid; place-items: center; z-index: 50; padding: 16px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { width: min(460px, 100%); background: var(--bg2); border: 1px solid var(--border); border-radius: 20px; padding: 22px; box-shadow: var(--shadow); animation: pop .25s; }
.modal h3 { margin: 0 0 8px; }
.modal p { color: var(--muted); margin: 0 0 18px; font-size: 14.5px; }
.modal .row { display: flex; gap: 10px; justify-content: flex-end; }

/* ---------- theory ---------- */
.th-banner {
  display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center;
  padding: 18px 20px; border-radius: 20px; margin-bottom: 4px;
  background: linear-gradient(135deg, rgba(52,211,153,0.16), rgba(34,211,238,0.10));
  border: 1px solid rgba(52,211,153,0.32);
}
.th-banner .ico { width: 52px; height: 52px; border-radius: 15px; display: grid; place-items: center; font-size: 26px; background: rgba(52,211,153,0.2); }
.th-banner b { font-size: 17px; display: block; }
.th-banner small { color: var(--muted); font-size: 13px; }
.btn.green { background: linear-gradient(135deg, #10b981, #0d9488); color: #fff; border: 0; box-shadow: 0 8px 22px rgba(16,185,129,0.35); }
.th-search { position: relative; margin-bottom: 18px; }
.th-search input {
  width: 100%; padding: 14px 16px 14px 44px; border-radius: 14px; font: inherit; font-size: 15px;
  background: var(--card); color: var(--text); border: 1px solid var(--border); outline: none; transition: .2s;
}
.th-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(139,108,255,0.15); }
.th-search svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); }
.th-results { display: grid; gap: 8px; margin-bottom: 18px; }
.th-res { text-align: left; padding: 11px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); display: flex; gap: 10px; align-items: center; transition: .15s; }
.th-res:hover { border-color: var(--accent); }
.th-res small { color: var(--muted); }
.th-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.th-card {
  text-align: left; padding: 18px; border-radius: 18px; background: var(--card); border: 1px solid var(--border);
  transition: .2s; display: flex; flex-direction: column; gap: 8px; position: relative;
}
.th-card:hover { background: var(--card-hi); transform: translateY(-2px); }
.th-card .hd { display: flex; gap: 12px; align-items: center; }
.th-card .hd .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; flex: none; }
.th-card .hd b { font-size: 15.5px; }
.th-card .hd small { display: block; color: var(--faint); font-size: 12px; }
.th-card p { margin: 0; color: var(--muted); font-size: 13.5px; }
.th-card .secs { display: flex; flex-wrap: wrap; gap: 5px; }
.th-card .secs span { font-size: 11.5px; padding: 3px 8px; border-radius: 99px; background: var(--card-hi); border: 1px solid var(--border); color: var(--muted); }
.th-card .done { position: absolute; top: 14px; right: 14px; font-size: 12px; font-weight: 700; color: var(--good); background: var(--good-bg); padding: 2px 9px; border-radius: 99px; }

.th-layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; align-items: start; }
.th-side { position: sticky; top: 16px; display: flex; flex-direction: column; gap: 3px; max-height: calc(100vh - 32px); overflow-y: auto; padding-right: 4px; }
.th-side .lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 4px 10px 6px; font-weight: 700; }
.th-side button { text-align: left; padding: 8px 11px; border-radius: 10px; font-size: 13.5px; color: var(--muted); transition: .15s; border-left: 2px solid transparent; }
.th-side button:hover { background: var(--card); color: var(--text); }
.th-side button.on { color: var(--text); background: var(--card); border-left-color: var(--accent); }
.th-head { border-radius: 22px; padding: 24px; margin-bottom: 18px; border: 1px solid var(--border); position: relative; overflow: hidden; }
.th-head .ico { font-size: 34px; }
.th-head h2 { margin: 6px 0 6px; font-size: 27px; letter-spacing: -0.5px; }
.th-head p { margin: 0; color: var(--muted); font-size: 15.5px; max-width: 680px; }
.th-sec { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 22px 24px; margin-bottom: 14px; scroll-margin-top: 16px; }
.th-sec h3 { margin: 0 0 12px; font-size: 19px; letter-spacing: -0.3px; display: flex; gap: 10px; align-items: center; }
.th-sec h3 .num { width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: #fff; flex: none; }
.th-sec > p, .th-body > p { margin: 0 0 12px; font-size: 15.2px; line-height: 1.62; }
.th-sec ul { margin: 0 0 12px; padding-left: 4px; list-style: none; display: grid; gap: 7px; }
.th-sec li { position: relative; padding-left: 20px; font-size: 15px; line-height: 1.55; }
.th-sec li::before { content: ""; position: absolute; left: 4px; top: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tbl-wrap { overflow-x: auto; margin: 0 0 14px; border-radius: 14px; border: 1px solid var(--border); }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; padding: 10px 14px; background: var(--card-hi); color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; font-weight: 700; white-space: nowrap; }
.tbl td { padding: 10px 14px; border-top: 1px solid var(--border); vertical-align: top; }
.tbl code.ic { white-space: nowrap; }
.tbl tr:hover td { background: rgba(139,108,255,0.05); }
.call { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 12px 14px; border-radius: 14px; margin: 0 0 12px; font-size: 14.6px; line-height: 1.55; }
.call .ci { font-size: 17px; line-height: 1.3; }
.call.warn { background: rgba(245,158,11,0.10); border: 1px solid rgba(245,158,11,0.32); }
.call.tip { background: rgba(34,211,238,0.08); border: 1px solid rgba(34,211,238,0.28); }
.call b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 2px; }
.call.warn b { color: var(--warn); } .call.tip b { color: var(--accent2); }
.out { margin: -6px 0 14px; border-radius: 0 0 15px 15px; background: #070912; border: 1px solid var(--code-border); border-top: 0; padding: 10px 16px 12px; }
.code.has-out { border-radius: 15px 15px 0 0; margin-bottom: 0; }
.out .ol { font-size: 11.5px; color: #6b7192; font-family: var(--mono); display: flex; gap: 8px; align-items: center; margin-bottom: 4px; }
.out .ol .ok { color: #22c55e; margin-left: auto; font-family: var(--font); font-weight: 600; }
.out pre { margin: 0; font-family: var(--mono); font-size: 14px; color: #c3e88d; white-space: pre-wrap; line-height: 1.55; }
.out.err pre { color: #ff7a90; }
.out .in { font-family: var(--mono); font-size: 12.5px; color: var(--accent2); margin-bottom: 6px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 4px; font-size: 12px; color: var(--faint); }
.refs span { font-family: var(--mono); font-size: 11.5px; padding: 2px 8px; border-radius: 7px; background: var(--card-hi); border: 1px solid var(--border); color: var(--muted); }
.th-end { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 20px 24px; border-radius: 20px; background: linear-gradient(135deg, rgba(139,108,255,0.18), rgba(34,211,238,0.10)); border: 1px solid rgba(139,108,255,0.3); margin-bottom: 14px; }
.th-end b { font-size: 16px; margin-right: auto; }
.th-pn { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.th-pn button { text-align: left; padding: 14px 16px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); transition: .15s; }
.th-pn button:hover { border-color: var(--accent); }
.th-pn button small { display: block; color: var(--faint); font-size: 12px; }
.th-pn button.r { text-align: right; }
.fb-row { display: flex; justify-content: flex-end; margin-top: 10px; }
/* drawer */
.drawer-bg { position: fixed; inset: 0; background: rgba(5,6,14,0.55); backdrop-filter: blur(4px); z-index: 55; animation: fade .2s; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); border-left: 1px solid var(--border); z-index: 56; overflow-y: auto; padding: 18px 20px 40px; animation: slide .28s ease; box-shadow: -20px 0 60px rgba(0,0,0,0.4); }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.drawer .dtop { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; position: sticky; top: -18px; background: var(--bg); padding: 10px 0; z-index: 2; }
@media (max-width: 900px) {
  .th-layout { grid-template-columns: 1fr; }
  .th-side { display: none; }
}
@media (max-width: 640px) {
  .th-grid, .th-pn { grid-template-columns: 1fr; }
  .th-banner { grid-template-columns: auto 1fr; }
  .th-banner .btn { grid-column: 1 / -1; }
  .th-sec { padding: 18px 16px; }
  .th-head h2 { font-size: 22px; }
}

canvas#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 60; }

@media (max-width: 900px) {
  .modes { grid-template-columns: repeat(2, 1fr); }
  .tests { grid-template-columns: repeat(4, 1fr); }
  .hero { grid-template-columns: 1fr; }
}
@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
  .topics, .breakdown { grid-template-columns: 1fr; }
  .tests { grid-template-columns: repeat(3, 1fr); }
  .hero { padding: 20px; } .hero h2 { font-size: 23px; }
  .qcard { padding: 18px; } .qtext { font-size: 16.5px; }
  .res-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .res-stats { justify-content: center; }
  .kbd-hint { display: none; }
  .code pre { font-size: 12.8px; }
  .code .ln .no { width: 32px; padding-right: 10px; }
}
</style>

canner `teclat`?", "code": null, "input": null, "opts": ["`teclat.next().charAt(0)`", "`teclat.nextChar()`", "`teclat.charAt(0)`", "`teclat.nextLine(0)`"], "ok": 0, "exp": "Scanner no té `nextChar()`. Es llegeix una paraula amb `next()` i se n'agafa el primer caràcter amb `charAt(0)` (ProvaChar).", "verified": false}, {"id": 6, "tema": "tipus", "tipus": "codi", "q": "Què passa amb aquest codi?", "code": "final int IVA = 21;\nSystem.out.println(\"IVA: \" + IVA);\nIVA = 11;", "input": null, "opts": ["No compila: no es pot canviar el valor d'una constant", "Mostra IVA: 21", "Mostra IVA: 11", "Error en execució"], "ok": 0, "exp": "`final` declara una constant: un cop té valor, no es pot tornar a assignar (ProvaConstant).", "verified": true}, {"id": 7, "tema": "tipus", "tipus": "teoria", "q": "Quina paraula reservada fem servir en Java per declarar una constant?", "code": null, "input": null, "opts": ["`final`", "`const`", "`static`", "`constant`"], "ok": 0, "exp": "Exemple: `final double IVA = 0.21;`", "verified": false}, {"id": 8, "tema": "tipus", "tipus": "teoria", "q": "Segons el criteri dels exemples del curs, com s'han d'escriure els noms de les constants?", "code": null, "input": null, "opts": ["En majúscules, separant paraules amb `_` (per ex. `CONV_SEGONS_HORA`)", "En minúscules (per ex. `convsegonshora`)", "Començant amb majúscula i la resta minúscula", "Amb el símbol `$` davant"], "ok": 0, "exp": "A Exercici13: `final int CONV_SEGONS_HORA = 3600;`", "verified": false}, {"id": 9, "tema": "tipus", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "int i = 7;\ndouble d = i;\nSystem.out.println(\"d= \" + d);", "input": null, "opts": ["d= 7.0", "d= 7", "d= 7,0", "No compila"], "ok": 0, "exp": "Un `int` es pot assignar a un `double` sense cast (conversió automàtica). Es mostra amb decimal: `7.0`.", "verified": true}, {"id": 10, "tema": "tipus", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "double d2 = 13.13;\nint i2 = (int) d2;\nSystem.out.println(\"i2= \" + i2);", "input": null, "opts": ["i2= 13", "i2= 13.13", "i2= 14", "No compila"], "ok": 0, "exp": "El cast `(int)` trunca: elimina els decimals sense arrodonir (ProvaConversio).", "verified": true}, {"id": 11, "tema": "tipus", "tipus": "codi", "q": "Què passa amb aquest codi?", "code": "double d2 = 13.13;\nint i2 = d2;\nSystem.out.println(i2);", "input": null, "opts": ["No compila: cal fer un cast `(int)`", "Mostra 13", "Mostra 13.13", "Mostra 0"], "ok": 0, "exp": "Passar de `double` a `int` pot perdre informació, per això Java obliga a fer el cast explícit `(int) d2`.", "verified": true}, {"id": 12, "tema": "tipus", "tipus": "teoria", "q": "Què fa el cast `(int)` aplicat a 34.7?", "code": null, "input": null, "opts": ["Dona 34: elimina els decimals", "Dona 35: arrodoneix", "Dona 34.7", "Dona error"], "ok": 0, "exp": "A ExerciciA115: `int entertruncat = (int) 34.7;` → 34. Truncar no és arrodonir.", "verified": false}, {"id": 13, "tema": "tipus", "tipus": "codi", "q": "Digues què surt per pantalla (Exercici10):", "code": "int myLuckyNumber = 13;\nSystem.out.println(myLuckyNumber + 1);\nSystem.out.println(myLuckyNumber);\nmyLuckyNumber = 5 + 2;\nSystem.out.println(myLuckyNumber);", "input": null, "opts": ["14\n13\n7", "14\n14\n7", "131\n13\n7", "14\n13\n52"], "ok": 0, "exp": "`myLuckyNumber + 1` mostra 14 però no canvia la variable, que continua valent 13. Després se li assigna 5 + 2 = 7.", "verified": true}, {"id": 14, "tema": "tipus", "tipus": "codi", "q": "Quin valor final té `x`? (ProvaEnters1)", "code": "int x;\nx = 10;\nx = 20;\nint y = 3;\nx = x + 1;\nx++;\nx--;\nSystem.out.println(\"x= \" + x);", "input": null, "opts": ["x= 21", "x= 20", "x= 22", "x= 24"], "ok": 0, "exp": "20 → `x+1` = 21 → `x++` = 22 → `x--` = 21.", "verified": true}, {"id": 15, "tema": "tipus", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "int x = 20, y = 3;\nSystem.out.println(x + \" + \" + y + \" = \" + x + y);", "input": null, "opts": ["20 + 3 = 203", "20 + 3 = 23", "23 + 3 = 23", "No compila"], "ok": 0, "exp": "Com que a l'esquerra ja hi ha un String, el `+` concatena: s'afegeix \"20\" i després \"3\". Per sumar cal parèntesis: `(x+y)`, com a ProvaEnters1.", "verified": true}, {"id": 16, "tema": "tipus", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "int x = 20, y = 3;\nSystem.out.println(x + \" + \" + y + \" = \" + (x + y));", "input": null, "opts": ["20 + 3 = 23", "20 + 3 = 203", "x + y = 23", "23"], "ok": 0, "exp": "Els parèntesis fan que primer se sumin els números (23) i després es concateni.", "verified": true}, {"id": 17, "tema": "tipus", "tipus": "teoria", "q": "Què fa l'operador `x++`?", "code": null, "input": null, "opts": ["Suma 1 al valor de x", "Multiplica x per 2", "Suma x amb ell mateix", "Resta 1 a x"], "ok": 0, "exp": "És l'operador d'autoincrement (ProvaEnters1). `x--` resta 1.", "verified": false}, {"id": 18, "tema": "tipus", "tipus": "teoria", "q": "Quina línia és equivalent a `suma += num;`?", "code": null, "input": null, "opts": ["`suma = suma + num;`", "`suma = num;`", "`num = suma + num;`", "`suma = suma + 1;`"], "ok": 0, "exp": "`+=` suma el valor de la dreta a la variable. Es fa servir als bucles (Exercici10, Exercici16).", "verified": false}, {"id": 19, "tema": "tipus", "tipus": "teoria", "q": "Quina és una declaració múltiple correcta?", "code": null, "input": null, "opts": ["`int x, y;`", "`int x; y;`", "`int x int y;`", "`x, y int;`"], "ok": 0, "exp": "Es poden declarar diverses variables del mateix tipus en una línia separant-les amb comes (ProvaEnters3).", "verified": false}, {"id": 20, "tema": "tipus", "tipus": "codi", "q": "Què mostra aquest codi? (Exercici12)", "code": "double x = 10.5;\nint y = 4;\ny = (int) (x + y);\nSystem.out.println(\"El valor final de x es: \" + y);", "input": null, "opts": ["El valor final de x es: 14", "El valor final de x es: 14.5", "El valor final de x es: 15", "No compila"], "ok": 0, "exp": "10.5 + 4 = 14.5, i el cast `(int)` el trunca a 14.", "verified": ompte = 0.2;\n        break;\n}\nSystem.out.println(descompte);", "input": null, "opts": ["-1.0", "0.2", "0.0", "No compila"], "ok": 0, "exp": "El switch amb Strings distingeix majúscules: \"PREMIUM\" no és igual a \"premium\". Queda el valor -1, que indica client incorrecte.", "verified": true}, {"id": 100, "tema": "condicionals", "tipus": "codi", "q": "L'usuari escriu `Arxiu`. Què mostra el programa? (Exercici2 d'Operadors lògics)", "code": "Scanner teclat = new Scanner(System.in);\nString textIntroduit = teclat.nextLine().toLowerCase();\nboolean resultat = false;\nswitch (textIntroduit) {\n    case \"Arxiu\", \"Buscar\", \"Sortir\":\n        resultat = true;\n        break;\n}\nif (resultat) {\n    System.out.println(\"Correcte\");\n} else {\n    System.out.println(\"Error\");\n}", "input": "Arxiu", "opts": ["Error", "Correcte", "No compila", "No mostra res"], "ok": 0, "exp": "El text es passa a minúscules (\"arxiu\") però els case estan amb majúscula (\"Arxiu\"), així que mai coincideixen. Els case haurien de ser \"arxiu\", \"buscar\", \"sortir\".", "verified": true}, {"id": 101, "tema": "condicionals", "tipus": "codi", "q": "L'usuari vol dividir 10 entre 2 amb l'operació 'd'. Què mostra? (EjercicioString2)", "code": "int num1 = 10, num2 = 2;\nchar operacion = 'd';\nint resultat = 0;\nswitch (operacion) {\n    case 's': resultat = num1 + num2;\n        break;\n    case 'r': resultat = num1 - num2;\n        break;\n    case 'm': resultat = num1 * num2;\n        break;\n    case 'd': if (num2 == 0) {\n                System.out.println(\"No es pot dividir per 0\");\n              } else {\n                resultat = num1 + num2;\n              }\n        break;\n    default:\n        System.out.println(\"Lletra no valida\");\n}\nSystem.out.println(resultat);", "input": null, "opts": ["12", "5", "0", "No es pot dividir per 0"], "ok": 0, "exp": "Hi ha un error al programa original: al case 'd' fa `num1 + num2` en lloc de `num1 / num2`.", "verified": true}, {"id": 10 q": "Quin missatge mostra amb 10 graus? (Nivell3, Exercici2)", "code": "double grausCelcius = 10;\nString resultat = \"Tòrrid\";\nif (grausCelcius <= 0) {\n    resultat = \"congelat\";\n} else if (grausCelcius <= 10) {\n    resultat = \"molt fred\";\n} else if (grausCelcius <= 20) {\n    resultat = \"fred\";\n} else if (grausCelcius <= 30) {\n    resultat = \"agradable\";\n} else if (grausCelcius <= 40) {\n    resultat = \"calorós\";\n}\nSystem.out.println(resultat);", "input": null, "opts": ["molt fred", "fred", "congelat", "Tòrrid"], "ok": 0, "exp": "10 <= 0 és fals, però 10 <= 10 és cert.", "verified": true}, {"id": 110, "tema": "condicionals", "tipus": "codi", "q": "Mateix programa (Nivell3, Exercici2), ara amb 45 graus. Quin missatge mostra?", "code": "double grausCelcius = 45;\nString resultat = \"Tòrrid\";\nif (grausCelcius <= 0) {\n    resultat = \"congelat\";\n} else if (grausCelcius <= 10) {\n    resultat = \"molt fred\";\n} else if (grausCelcius <= 20) {\n    resultat = \"fred\";\n} else if (grausCelcius <= 30) {\n    resultat = \"agradable\";\n} else if (grausCelcius <= 40) {\n    resultat = \"calorós\";\n}\nSystem.out.println(resultat);", "input": null, "opts": ["Tòrrid", "calorós", "No mostra res", "congelat"], "ok": 0, "exp": "No es compleix cap condició, així que es manté el valor inicial \"Tòrrid\".", "verified": true}, {"id": 111, "tema": "condicionals", "tipus": "codi", "q": "L'any 1900 és de traspàs? Què mostra aquest codi?", "code": "int any = 1900;\nif (((any % 4 == 0) && (any % 100 != 0)) || (any % 400 == 0)) {\n    System.out.println(\"Traspàs\");\n} else {\n    System.out.println(\"No traspàs\");\n}", "input": null, "opts": ["No traspàs", "Traspàs", "No compila", "No mostra res"], "ok": 0, "exp": "1900 és divisible per 4 però també per 100, i no ho és per 400. Per tant, no és de traspàs (Exercici11_A2).", "verified": true}, {"id": 112, "tema": "condicionals", "tipus": "codi", "q": "Mateix codi (Exercici11_A2), ara amb l'any 2000. Què mostra? cles", "tipus": "codi", "q": "Què dibuixa aquest codi amb files = 3? (Exercici26, dibuixarTriangle)", "code": "int files = 3;\nfor (int i = 1; i <= files; i++) {\n    for (int j = 0; j < i; j++) {\n        System.out.print(\"+\");\n    }\n    System.out.println();\n}", "input": null, "opts": ["+\n++\n+++", "+++\n++\n+", "+++\n+++\n+++", "++\n+++\n++++"], "ok": 0, "exp": "A la fila i el bucle de dins escriu i caràcters: 1, 2 i 3.", "verified": true}, {"id": 190, "tema": "bucles", "tipus": "codi", "q": "Què dibuixa aquest codi amb files = 3? (dibuixarTriangleInvertit)", "code": "int files = 3;\nfor (int i = 1; i <= files; i++) {\n    for (int j = 0; j < files - i; j++) {\n        System.out.print(\".\");\n    }\n    for (int j = 0; j < i; j++) {\n        System.out.print(\"+\");\n    }\n    System.out.println();\n}", "input": null, "opts": ["..+\n.++\n+++", "+..\n++.\n+++", "+++\n.++\n..+", "..+\n..++\n..+++"], "ok": 0, "exp": "Cada fila escriu primer (files - i) espais (aquí punts, perquè es vegin) i després i caràcters. Així el triangle queda alineat a la dreta.", "verified": true}, {"id": 191, "tema": "bucles", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "int suma = 0;\nfor (int i = 1; i <= 5; i++) {\n    suma += i;\n}\nSystem.out.println(suma);", "input": null, "opts": ["15", "10", "5", "14"], "ok": 0, "exp": "1 + 2 + 3 + 4 + 5 = 15.", "verified": true}, {"id": 192, "tema": "bucles", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "for (int i = 10; i > 0; i -= 3) {\n    System.out.print(i + \" \");\n}\nSystem.out.println();", "input": null, "opts": ["10 7 4 1", "10 7 4 1 -2", "10 7 4", "9 6 3"], "ok": 0, "exp": "Resta 3 a cada volta: 10, 7, 4, 1. Després i = -2 i la condició `i > 0` ja és falsa.", "verified": true}, {"id": 193, "tema": "bucles", "tipus": "codi", "q": "Quantes voltes fa aquest bucle?", "code": "int voltes = 0;\nfor (int i = 0; i <= 10; i += 2) {\n    voltes++;\n}\nSystem.out.println(voltes);", "input": null, "opts": ["6", "5", "10", "11"], "ok": 0, "exp": "i val 0, 2, 4, 6, 8 i 10: són 6 voltes.", "verified": true}, {"id": 194, "tema": "bucles", "tipus": "codi", "q": "Què passa amb aquest codi?", "code": "int i = 0;\nwhile (i < 5) {\n    System.out.println(i);\n}", "input": null, "opts": ["Bucle infinit: escriu 0 sense parar", "Escriu 0, 1, 2, 3, 4", "No escriu res", "No compila"], "ok": 0, "exp": "Falta `i++`: `i` sempre val 0 i la condició sempre és certa.", "verified": false}, {"id": 195, "tema": "bucles", "tipus": "codi", "q": "Què passa amb aquest codi?", "code": "for (int i = 0; i < 3; i++) {\n    System.out.print(i);\n}\nSystem.out.println(i);", "input": null, "opts": ["No compila: `i` només existeix dins del for", "Mostra 0123", "Mostra 0122", "Mostra 012"], "ok": 0, "exp": "La variable declarada a la inicialització del `for` només existeix dins del bucle.", "verified": true}, {"id": 196, "tema": "bucles", "tipus": "codi", "q": "L'usuari escriu 5, després S, després 7, després N. Què mostra? (Exercici16)", "code": "Scanner teclat = new Scanner(System.in);\nint suma = 0;\nString resposta;\ndo {\n    int num1 = teclat.nextInt();\n    suma += num1;\n    resposta = teclat.next();\n} while (!resposta.equalsIgnoreCase(\"N\"));\nSystem.out.println(\"La suma és \" + suma);", "input": "5 ⏎ S ⏎ 7 ⏎ N", "opts": ["La suma és 12", "La suma és 5", "La suma és 7", "La suma és 0"], "ok": 0, "exp": "Suma el 5, l'usuari diu S (continuar), suma el 7, l'usuari diu N (sortir): 5 + 7 = 12.", "verified": true}, {"id": 197, "tema": "bucles", "tipus": "teoria", "q": "A Exercici17, el bucle és `do { ... } while (numero != numeroAleatori && continuar.equals(\"s\"));`. Quan s'acaba?", "code": null, "input": null, "opts": ["Quan l'usuari encerta el número o quan no vol continuar", "Només quan l'usuari encerta el número", "Només quan l'usuari no vol continuar", "Mai, és infinit"], "ok": 0, "exp": "Amb `&&` es continua mentre les dues condicions siguin certes. Que una sola sigui falsa ja atura el bucle.", "verified": false}, {"id": 198, "tema": "bucles", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "int i = 10;\ndo {\n    System.out.println(\"Volta \" + i);\n    i++;\n} while (i < 5);", "input": null, "opts": ["Volta 10", "No mostra res", "Volta 10\nVolta 11", "Bucle infinit"], "ok": 0, "exp": "El `do-while` executa el cos una vegada abans de comprovar la condició (10 < 5 és fals).", "verified": true}, {"id": 199, "tema": "bucles", "tipus": "codi", "q": "Mateixa idea amb `while`. Què mostra?", "code": "int i = 10;\nwhile (i < 5) {\n    System.out.println(\"Volta \" + i);\n    i++;\n}\nSystem.out.println(\"Fi\");", "input": null, "opts": ["Fi", "Volta 10\nFi", "No mostra res", "Bucle infinit"], "ok": 0, "exp": "El `while` comprova la condició abans d'entrar. Com que 10 < 5 és fals, no entra mai.", "verified": true}, {"id": 200, "tema": "bucles", "tipus": "completa", "q": "Completa el `for` perquè escrigui els números del 5 a l'1 (5 4 3 2 1):", "code": "for (____) {\n    System.out.print(i + \" \");\n}\nSystem.out.println();", "input": null, "opts": ["int i = 5; i >= 1; i--", "int i = 5; i > 1; i--", "int i = 1; i <= 5; i++", "int i = 5; i >= 1; i++"], "ok": 0, "exp": "Comença a 5, continua mentre `i >= 1` (l'1 inclòs) i resta 1 a cada volta.", "verified": true}, {"id": 201, "tema": "bucles", "tipus": "completa", "q": "Completa el bucle d'Exercisi8 perquè compti les xifres del número:", "code": "int numeroClon = 98765;\nint suma = 0;\nwhile (numeroClon > 0) {\n    ____;\n    suma++;\n}\nSystem.out.println(suma);", "input": null, "opts": ["numeroClon = numeroClon / 10", "numeroClon = numeroClon % 10", "numeroClon = numeroClon - 1", "numeroClon = numeroClon * 10"], "ok": 0, "exp": "Dividir per 10 elimina l'última xifra; cada divisió és una xifra comptada.", "verified": true}, {"id": 202, "tema": "bucles", "tipus": "vf", "q": "Un bucle `while` sempre s'executa almenys una vegada.", "code": null, "input": null, "opts": ["Fals", "Vertader"], "ok": 0, "exp": "Si la condició és falsa des del principi, no s'executa cap vegada. El que s'executa sempre almenys un cop és el `do-while`.", "verified": false}, {"id": 203, "tema": "funcions", "tipus": "teoria", "q": "A `public static int llegirEnter(String missatge)`, què indica `int`?", "code": null, "input": null, "opts": ["El tipus del valor que retorna la funció", "El tipus del paràmetre", "El número de paràmetres", "Que la funció és pública"], "ok": 0, "exp": "La funció retorna un enter amb `return teclat.nextInt();`.", "verified": false}, {"id": 204, "tema": "funcions", "tipus": "teoria", "q": "A `public static int llegirEnter(String missatge)`, què és `String missatge`?", "code": null, "input": null, "opts": ["El paràmetre que rep la funció", "El valor que retorna", "Una variable global", "El nom de la classe"], "ok": 0, "exp": "Quan la cridem, `Utils.llegirEnter(\"Nota: \")`, el text \"Nota: \" es copia a `missatge`.", "verified": false}, {"id": 205, "tema": "funcions", "tipus": "teoria", "q": "Què vol dir que una funció sigui `void`, com `public static void escriureDecreixent(int n1, int n2)`?", "code": null, "input": null, "opts": ["Que no retorna cap valor", "Que no rep cap paràmetre", "Que és buida i no fa res", "Que retorna un String buit"], "ok": 0, "exp": "Una funció `void` fa una feina (escriure per pantalla) però no retorna res.", "verified": false}, {"id": 206, "tema": "funcions", "tipus": "teoria", "q": "Com es crida des d'una altra classe la funció `llegirEnter` de la llibreria `Utils`?", "code": null, "input": null, "opts": ["`Utils.llegirEnter(\"Missatge: \")`", "`llegirEnter.Utils(\"Missatge: \")`", "`Utils->llegirEnter(\"Missatge: \")`", "`new llegirEnter()`"], "ok": 0, "exp": "Les funcions `static` es criden amb el nom de la classe, un punt i el nom de la funció.", "verified": false}, {"id": 207, "tema": "funcions", "tipus": "teoria", "q": "Per què a Exercici5AmbFuncio el Scanner es declara fora del main com `public static Scanner teclat`?", "code": null, "input": null, "opts": ["Perquè hi puguin accedir totes les funcions de la classe, com `llegirNumero()`", "Perquè dins del main no es pot crear un Scanner", "Perquè és obligatori en tots els programes", "Perquè així llegeix més ràpid"], "ok": 0, "exp": "El comentari diu: «Declara el teclat fora del main perquè hi pugui accedir la funció llegirNumero()».", "verified": false}, {"id": 208, "tema": "funcions", "tipus": "codi", "q": "Què passa amb aquest codi? (Exercisi1 de Booleans)", "code": "public class Prova {\n    public static int llegirNumero(int n) {\n        System.out.print(\"Número: \" + n);\n    }\n    public static void main(String[] args) {\n        int edat = llegirNumero(18);\n        System.out.println(edat);\n    }\n}", "input": null, "opts": ["No compila: falta el `return` a una funció que ha de retornar un `int`", "Mostra Número: 18", "Mostra 18", "Mostra Número: 1818"], "ok": 0, "exp": "Si una funció declara que retorna `int`, tots els camins han d'acabar en un `return` amb un valor.", "verified": true}, {"id": 209, "tema": "funcions", "tipus": "codi", "q": "Què mostra aquest codi?", "code": "public static int doble(int n) {\n    return n * 2;\n}\npublic static void main(String[] args) {\n    System.out.println(doble(3) + doble(4));\n}", "input": null, "opts": ["14", "68", "7", "24"], "ok": 0, "exp": "doble(3) = 6 i doble(4) = 8, i com que són enters se sumen: 14.", "verified": true}, {"id": 210, "tema": "funcions", "tipus": "codi", "q": "Què mostra aquest codi? (escriureDecreixent d'Exercici1)", "code": "public static void escriureDecreixent(int n1, int n2) {\n    for (int i = n1; i >= n2; i--) {\n        System.out.print(i + \" \");\n    }\n    System.out.println();\n}\npublic static void main(String[] args) {\n    int num1 = 2, num2 = 5;\n    escriureDecreixent(num2, num1);\n}", "input": null, "opts": ["5 4 3 2", "2 3 4 5", "No escriu res", "5 4 3"], "ok": 0, "exp": "Es crida amb (num2, num1) = (5, 2): `n1` rep 5 i `n2` rep 2. L'ordre dels arguments és : "teoria", "q": "Què fa la instrucció `return` dins d'una funció?", "code": null, "input": null, "opts": ["Retorna un valor a qui ha cridat la funció i acaba la funció", "Torna a començar la funció", "Escriu el valor per pantalla", "Acaba tot el programa"], "ok": 0, "exp": "El valor retornat es pot guardar en una variable o fer-lo servir directament: `System.out.println(\"La suma és \" + sumaNumeros());`.", "verified": false}, {"id": 215, "tema": "funcions", "tipus": "codi", "q": "El fitxer es diu `Exercici1Sol2.java`. Què passa en compilar-lo?", "code": "public class condN3 {\n    public static void main(String[] args) {\n        System.out.println(\"Hola\");\n    }\n}", "input": null, "opts": ["No compila: una classe pública s'ha de dir igual que el fitxer", "Mostra Hola", "Compila però no mostra res", "Mostra condN3"], "ok": 0, "exp": "Si la classe és `public class condN3`, el fitxer s'ha de dir `condN3.java`. Aquest és el cas del fitxer Exercici1Sol2.java del zip.", "verified": false}, {"id": 216, "tema": "funcions", "tipus": "teoria", "q": "Per què es fa servir la llibreria Utils en lloc de copiar la funció `llegirEnter()` a cada programa?", "code": null, "input": null, "opts": ["Perquè les funcions comunes s'escriuen un cop a `Utils` i es criden des de qualsevol programa", "Perquè no es poden fer funcions pròpies", "Perquè és obligatori copiar-la a cada fitxer", "Perquè `llegirEnter` ve inclosa amb Java"], "ok": 0, "exp": "Així no es repeteix codi.", "verified": false}, {"id": 217, "tema": "funcions", "tipus": "codi", "q": "Què retorna `llegirChar` si l'usuari escriu `Resta`? (Utils)", "code": "static Scanner teclat = new Scanner(System.in);\npublic static char llegirChar(String missatge) {\n    System.out.print(missatge);\n    return teclat.next().toLowerCase().charAt(0);\n}\npublic static void main(String[] args) {\n    char c = llegirChar(\"Operació: \");\n    System.out.println();\n    System.out.println(c);\n}", "input": "Resta", "opts": ["Operació: \nr" /* Generadors de preguntes amb valors aleatoris, basats en els exercicis del zip.
   Cada generador retorna una pregunta de tipus "codi" amb la resposta calculada. */
var GEN = (function () {
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function idiv(a, b) { return Math.trunc(a / b); }
  function jdouble(v) { return Number.isInteger(v) ? v + ".0" : String(v); }

  // Build 4 unique options with the correct one at a random position.
  function build(tema, q, code, correct, distract, exp, ref, fallback) {
    var opts = [String(correct)];
    var pool = distract.map(String);
    for (var i = 0; i < pool.length && opts.length < 4; i++) {
      if (opts.indexOf(pool[i]) < 0) opts.push(pool[i]);
    }
    var guard = 0;
    while (opts.length < 4 && fallback && guard++ < 50) {
      var f = String(fallback());
      if (opts.indexOf(f) < 0) opts.push(f);
    }
    // shuffle
    for (var j = opts.length - 1; j > 0; j--) {
      var k = Math.floor(Math.random() * (j + 1));
      var t = opts[j]; opts[j] = opts[k]; opts[k] = t;
    }
    return { tema: tema, tipus: "codi", q: q, code: code, input: null, opts: opts,
             ok: opts.indexOf(String(correct)), exp: exp, gen: true, ref: ref };
  }

  var G = [];

  // 1. Divisió entera i residu
  G.push(function () {
    var a = rnd(11, 70), b = rnd(2, 9);
    if (a % b === 0) a++;

"}, {"k": "tip", "v": "Fer servir una variable a `println` no la canvia. A Exercici10, `System.out.println(myLuckyNumber + 1);` mostra 14, però la variable continua valent 13."}], "refs": "ProvaEnters1.java, ProvaEnters3.java, Exercici10.java"}, {"t": "Els tipus de dades del curs", "blocks": [{"k": "table", "head": ["Tipus", "Què guarda", "Exemple"], "rows": [["`int`", "Nombres enters", "`int edat = 20;`"], ["`double`", "Nombres decimals", "`double preu = 13.13;`"], ["`char`", "Un sol caràcter, entre cometes simples", "`char c1 = 'a';`"], ["`boolean`", "`true` o `false`", "`boolean avuiEsFestiu = false;`"], ["`String`", "Un text, entre cometes dobles", "`String s1 = \"Hola\";`"]]}, {"k": "warn", "v": "Un `char` va entre cometes simples (`'a'`) i un `String` entre dobles (`\"a\"`). `char c1 = \"a\";` no compila: «NO ES POT ASSIGNAR UN STRING A UN CHAR» (ProvaChar)."}, {"k": "p", "v": "Un `double` sempre es mostra amb decimals, encara que siguin zero: `7.0`. Un `String` buit és `\"\"`: no té cap caràcter."}, {"k": "code", "label": "ProvaString.java", "code": "String s1 = \"Bon\";\nString s2 = \"dia\";\nString s3 = \"\";\nString s4 = s1 + \" \" + s2;\nSystem.out.println(\"-\" + s3 + \"-\");\nSystem.out.println(\"s4: \" + s4);", "input": null, "out": "--\ns4: Bon dia", "expect": null, "check": true}], "refs": "ProvaChar.java, ProvaString.java, ProvaDecimal2.java, ProvaBoolean.java"}, {"t": "Constants amb final", "blocks": [{"k": "p", "v": "Una constant és una variable que no pot canviar de valor. Es declara amb `final` i, per conveni, el nom s'escriu en MAJÚSCULES, separant les paraules amb `_`."}, {"k": "code", "label": "Exercici13.java", "code": "final int CONV_SEGONS_HORA = 3600;\nfinal int CONV_SEGONS_MINUT = 60;\nfinal double IVA = 0.21;\nint totalSegons = 1 * CONV_SEGONS_HORA + 2 * CONV_SEGONS_MINUT + 3;\nSystem.out.println(totalSegons);", "input": null, "out": "3723", "expect": null, "check": true}, {"k": "warn", "v": "Si intentes canviar una constant (`IVA = 11;`), el programa no compila (ProvaConstant)."}, {"k": "tip", "v": "És millor `CONV_SEGONS_HORA` que escriure 3600 directament: el nom explica què és el número i, si canvia, només el canvies en un lloc."}], "refs": "ProvaConstant.java, Exercici13.java, Exercici11A1.java"}, {"t": "Conversions entre tipus (cast)", "blocks": [{"k": "p", "v": "De `int` a `double` la conversió és automàtica, perquè no es perd res. De `double` a `int` cal un cast `(int)`, que treu els decimals sense arrodonir (trunca)."}, {"k": "code", "label": "ProvaConversio.java", "code": "int i = 7;\ndouble d = i;            // automàtic\nSystem.out.println(\"d= \" + d);\ndouble d2 = 13.13;\nint i2 = (int) d2;       // cast obligatori: trunca\nSystem.out.println(\"i2= \" + i2);", "input": null, "out": "d= 7.0\ni2= 13", "expect": null, "check": true}, {"k": "warn", "v": "`int i2 = d2;` sense `(int)` no compila: es podria perdre informació. El mateix passa amb `y = x + y;` si `x` és double i `y` és int (Exercici12): cal `y = (int)(x + y);`."}, {"k": "p", "v": "Per això a ExerciciA13 es pot fer `double alcada = teclat.nextInt();`: l'enter es converteix sol a double."}], "refs": "ProvaConversio.java, Exercici12.java, ExerciciA13.java"}, {"t": "L'àmbit d'una variable", "blocks": [{"k": "p", "v": "Una variable només existeix dins del bloc `{ }` on s'ha declarat. Fora d'aquest bloc no es pot fer servir."}, {"k": "warn", "v": "A Exemple1, la variable `nom` només rep valor dins de l'if. Si després es fa `System.out.println(nom);`, no compila: «la variable podria no estar inicialitzada». Java no deixa fer servir una variable local sense valor."}, {"k": "code", "label": "Exemple1.java (versió que no compila)", "code": "int nota = 7;\nString nom;\nif (nota >= 5) {\n    nom = \"Enhorabona\";\n}\nSystem.out.println(nom);   // ERROR: nom potser no té valor", "input": null, "out": null, "expect": "compile-error", "check": true}], "refs": "Exemple1.java"}, {"t": "Concatenació amb +", "blocks": [{"k": "p", "v": "Si a una banda del `+` hi ha un String, el `+` enganxa textos en lloc de sumar. S'avalua d'esquerra a dreta."}, {"k": "code", "label": "ProvaEnters1.java", "code": "int x = 20, y = 3;\nSystem.out.println(x + \" + \" + y + \" = \" + x + y);\nSystem.out.println(x + \" + \" + y + \" = \" + (x + y));\nSystem.out.println(1 + 2 + \"3\");", "input": null, "out": "20 + 3 = 203\n20 + 3 = 23\n33", "expect": null, "check": true}, {"k": "tip", "v": "Per sumar dins d'un println, posa la suma entre parèntesis: `(x + y)`."}], "refs": "ProvaEnters1.java"}]}, {"tema": "operadors", "intro": "Els operadors fan càlculs amb les variables. La part més important (i on hi ha més trampes) és la divisió: entre enters, Java treu els decimals.", "secs": [{"t": "Operadors aritmètics", "blocks": [{"k": "table", "head": ["Operador", "Significat", "Exemple", "Resultat"], "rows": [["`+`", "Suma", "`7 + 2`", "`9`"], ["`-`", "Resta", "`7 - 2`", "`5`"], ["`*`", "Multiplicació", "`7 * 2`", "`14`"], ["`/`", "Divisió", "`7 / 2`", "`3` (entre int)"], ["`%`", "Residu de la divisió entera", "`7 % 2`", "`1`"]]}], "refs": ""}, {"t": "Divisió entera i divisió decimal", "blocks": [{"k": "p", "v": "Si els dos números són `int`, la divisió és entera: es perden els decimals. Si almenys un és `double`, la divisió és decimal."}, {"k": "code", "label": "ProvaDecimal2.java", "code": "int a = 7, b = 2;\nSystem.out.println(a / b);\ndouble x = 7.0, y = 2.0;\nSystem.out.println(x / y);", "input": null, "out": "3\n3.5", "expect": null, "check": true}, {"k": "p", "v": "Per obtenir decimals dividint enters es fa un cast a `double` abans de dividir. On poses el parèntesi és molt important:"}, {"k": "code", "label": "ProvaMitjanaNotes.java", "code": "int notaLMSGI = 7, notaPRO = 8;\ndouble bona = (double) (notaLMSGI + notaPRO) / 2;      // 15.0 / 2\ndouble dolenta = (double) ((notaLMSGI + notaPRO) / 2); // (15 / 2) = 7 → 7.0\nSystem.out.println(bona);\nSystem.out.println(dolenta);", "input": null, "out": "7.5\n7.0", "expect": null, "check": true}, {"k": "warn", "v": "Guardar el resultat en un `double` no salva la divisió: a `double mitjana = suma / contador;` (Exercici10), si tots dos són int, primer es fa la divisió entera i després es converteix. 7 / 2 dona 3.0, no 3.5."}, {"k": "warn", "v": "A Exercici8, `IMPOST_MENYS_15 / 100` és `10 / 100`, que entre enters dona 0. Per això el preu no augmentava. La solució és dividir per `100.0`."}, {"k": "code", "label": "Exercici8.java (l'error i la solució)", "code": "final int IMPOST_MENYS_15 = 10;\nint importe = 200;\nSystem.out.println(importe * (1 + IMPOST_MENYS_15 / 100));\nSystem.out.println(1 + IMPOST_MENYS_15 / 100.0);", "input": null, "out": "200\n1.1", "expect": null, "check": true}], "refs": "ProvaMitjanaNotes.java, Exercici2.java, Exercici8.java, Exercici10.java"}, {"t": "L'operador % (residu)", "blocks": [{"k": "p", "v": "`a % b` és el que sobra de dividir `a` entre `b`. Es fa servir molt:"}, {"k": "ul", "v": ["Saber si és parell: `n % 2 == 0` (senar: `n % 2 != 0`).", "Saber si és múltiple: `num % 5 == 0`.", "Obtenir l'última xifra: `4507 % 10` → 7 (i `4507 / 10` → 450 treu l'última xifra).", "Passar unitats (segons a hores i minuts...)."]}, {"k": "code", "label": "Exercici13_1.java", "code": "int segons = 3725;\nint hores = segons / 3600;    // 1\nsegons = segons % 3600;       // sobren 125\nint minuts = segons / 60;     // 2\nsegons = segons % 60;         // sobren 5\nSystem.out.println(hores + \" h \" + minuts + \" min \" + segons + \" s\");", "input": null, "out": "1 h 2 min 5 s", "expect": null, "check": true}, {"k": "tip", "v": "El patró de les conversions (Exercici13_1 i 13_2) és sempre el mateix: dividir per saber quants n'hi caben, i fer `%` per quedar-te amb el que sobra i continuar."}], "refs": "Exercici13_1.java, Exercici13_2.java, Exercici3.java, Exercisi9.java"}, {"t": "Increment i operadors combinats", "blocks": [{"k": "table", "head": ["Escrit així", "Equival a"], "rows": [["`x++`", "`x = x + 1`"], ["`x--`", "`x = x - 1`"], ["`suma += num`", "`suma = suma + num`"], ["`i -= 3`", "`i = i - 3`"]]}], "refs": "ProvaEnters1.java, Exercici10.java"}, {"t": "La classe Math", "blocks": [{"k": "table", "head": ["Funció", "Què fa", "Exemple", "Resultat"], "rows": [["`Math.pow(b, e)`", "Potència (retorna double)", "`Math.pow(2, 3)`", "`8.0`"], ["`Math.sqrt(n)`", "Arrel quadrada (double)", "`Math.sqrt(16)`", "`4.0`"], ["`Math.round(x)`", "Arrodoneix a l'enter més proper", "`Math.round(34.5)`", "`35`"], ["`Math.abs(x)`", "Valor absolut", "`Math.abs(-86)`", "`86`"], ["`Math.random()`", "Decimal aleatori de 0 (inclòs) a 1 (no inclòs)", "`Math.random()`", "`0.37...`"]]}, {"k": "code", "label": "ExerciciA115.java", "code": "System.out.println((int) 34.7);\nSystem.out.println(Math.round(34.7));\nSystem.out.println(Math.round(34.1));\nSystem.out.println(Math.pow(2, 3));", "input": null, "out": "34\n35\n34\n8.0", "expect": null, "check": true}, {"k": "warn", "v": "`(int)` trunca (34.7 → 34). `Math.round` arrodoneix (34.7 → 35)."}], "refs": "ExerciciA115.java, B_Exercici2.java"}, {"t": "Números aleatoris", "blocks": [{"k": "p", "v": "Per obtenir un enter a l'atzar entre un mínim i un màxim (tots dos inclosos), la funció de Utils fa:"}, {"k": "code", "label": "Utils.java", "code": "int minim = 1, maxim = 10;\nint n = (int) (Math.random() * (maxim - minim + 1) + minim);", "input": null, "out": null, "expect": null, "check": false}, {"k": "ul", "v": ["`(int)(Math.random() * 10 + 1)` → un enter de l'1 al 10 (Nivell 1, Exercici6).", "Amb la classe Random: `Random aleatori = new Random();` i `aleatori.nextInt(101)` dona de 0 a 100 (Exercici17)."]}], "refs": "Utils.java, Exercici6.java (Nivell 1), Exercici17.java"}]}, {"tema": "entrada", "intro": "Per llegir el que escriu l'usuari es fa servir un `Scanner`; per mostrar resultats, `System.out`.", "secs": [{"t": "Crear el Scanner", "blocks": [{"k": "code", "label": "ProvaEnters3.java", "code": "import java.util.Scanner;\n\npublic class ProvaEnters3 {\n    public static void main(String[] args) {\n        Scanner teclat = new Scanner(System.in);\n        System.out.print(\"Introdueix el valor de x: \");\n        int x = teclat.nextInt();\n        System.out.println(\"x= \" + x);\n        teclat.close();\n    }\n}", "input": "5", "out": "Introdueix el valor de x: x= 5", "expect": null, "check": true}, {"k": "ul", "v": ["`import java.util.Scanner;` va a dalt de tot. Sense això, Java no sap què és Scanner.", "`new Scanner(System.in)`: `System.in` és el teclat.", "`teclat.close();` tanca el Scanner al final."]}, {"k": "tip", "v": "Per demanar dades es fa servir `print` (sense ln) perquè l'usuari escrigui a la mateixa línia del missatge."}], "refs": "ProvaEnters3.java, ProvaDecimal3.java"}, {"t": "Mètodes per llegir", "blocks": [{"k": "table", "head": ["Mètode", "Llegeix", "Exemple"], "rows": [["`nextInt()`", "Un enter", "`int edat = teclat.nextInt();`"], ["`nextDouble()`", "Un decimal", "`double preu = teclat.nextDouble();`"], ["`next()`", "Una paraula (fins a l'espai)", "`String nom = teclat.next();`"], ["`nextLine()`", "Tota la línia, amb espais", "`String frase = teclat.nextLine();`"], ["`nextBoolean()`", "`true` o `false`", "`boolean estudiant = teclat.nextBoolean();`"], ["`next().charAt(0)`", "Un caràcter", "`char c2 = teclat.next().charAt(0);`"]]}, {"k": "p", "v": "Scanner no té `nextChar()`. Per llegir una lletra es llegeix una paraula i se n'agafa el primer caràcter. Si es vol en minúscula: `teclat.next().toLowerCase().charAt(0)`."}], "refs": "ProvaChar.java, ProvaString.java, EjercicioString2.java, Exercici3A5.java"}, {"t": "El problema de nextInt() + nextLine()", "blocks": [{"k": "p", "v": "`nextInt()` llegeix el número però deixa pendent el salt de línia (l'Enter). Si després fas `nextLine()`, llegeix aquest salt buit i el text queda buit."}, {"k": "code", "label": "ExerciciNomEdat.java", "code": "Scanner teclat = new Scanner(System.in);\nint edat = teclat.nextInt();\nteclat.nextLine();               // consumeix el salt de línia pendent\nString text = teclat.nextLine();\nSystem.out.println(\"[\" + text + \"] i \" + edat);", "input": "20\\nBon dia", "out": "[Bon dia] i 20", "expect": null, "check": true}, {"k": "warn", "v": "Sense la línia `teclat.nextLine();`, `text` seria `\"\"`."}], "refs": "ExerciciNomEdat.java"}, {"t": "Mostrar per pantalla", "blocks": [{"k": "ul", "v": ["`System.out.println(x)`: escriu i salta de línia.", "`System.out.print(x)`: escriu sense saltar de línia.", "`\\n` dins d'un text és un salt de línia i `\\t` és un tabulador (per exemple, per sagnar les opcions d'un menú: `\"\\t1. Pizza\"`)."]}, {"k": "code", "label": "Exercici13_1.java", "code": "System.out.print(\"A\");\nSystem.out.println(\"B\");\nSystem.out.println(\"RESULTAT: \\n\" + 1 + \" hores\");", "input": null, "out": "AB\nRESULTAT:\n1 hores", "expect": null, "check": true}], "refs": ""}, {"t": "printf: escriure amb format", "blocks": [{"k": "table", "head": ["Format", "Per a", "Exemple", "Mostra"], "rows": [["`%d`", "enters", "`printf(\"%d\", 5)`", "`5`"], ["`%02d`", "enter amb 2 xifres (zero davant)", "`printf(\"%02d\", 5)`", "`05`"], ["`%.2f`", "decimal amb 2 decimals", "`printf(\"%.2f\", 3.14159)`", "`3.14` (o `3,14`)"], ["`%s`", "text", "`printf(\"%s\", \"vip\")`", "`vip`"]]}, {"k": "code", "label": "Exercici12.java", "code": "int hores = 9, minuts = 5, segons = 7;\nSystem.out.printf(\"%02d:%02d:%02d\\n\", hores, minuts, segons);", "input": null, "out": "09:05:07", "expect": null, "check": true}, {"k": "tip", "v": "Amb `%.2f`, segons la configuració de l'ordinador, el decimal pot sortir amb coma (3,14). En canvi, `println` d'un double sempre fa servir el punt."}], "refs": "Exercici12.java, TipusDadesSimples5.java, Exercici2Millor.java"}, {"t": "La llibreria Utils", "blocks": [{"k": "p", "v": "A partir dels bucles, els programes fan servir una classe `Utils` amb funcions per no repetir codi:"}, {"k": "table", "head": ["Funció", "Què fa"], "rows": [["`Utils.llegirEnter(\"missatge\")`", "Mostra el missatge i retorna un int"], ["`Utils.llegirDecimal(\"missatge\")`", "Retorna un double"], ["`Utils.llegirChar(\"missatge\")`", "Retorna el primer caràcter en minúscula"], ["`Utils.llegirString(\"missatge\")`", "Retorna una paraula (`next()`)"], ["`Utils.llegirFrase(\"missatge\")`", "Retorna tota una línia (`nextLine()`)"], ["`Utils.borrarPantalla()`", "Neteja la consola"], ["`Utils.generarNumeroAleatori(min, max)`", "Enter aleatori de [min, max]"]]}], "refs": "Utils.java"}]}, {"tema": "condicionals", "intro": "Les estructures condicionals fan que el programa prengui decisions: executar un codi o un altre segons si es compleix una condició.", "secs": [{"t": "Operadors de comparació", "blocks": [{"k": "table", "head": ["Operador", "Significat", "Exemple"], "rows": [["`==`", "igual a", "`nota == 10`"], ["`!=`", "diferent de", "`n % 2 != 0`"], ["`<` / `>`", "menor / major que", "`nota < 5`"], ["`<=` / `>=`", "menor o igual / major o igual", "`nota >= 5`"]]}, {"k": "warn", "v": "`=` assigna i `==` compara. També s'escriu `>=`, no `=>`."}], "refs": ""}, {"t": "if i if-else", "blocks": [{"k": "code", "label": "Exemple1.java / Exercici2.java", "code": "int nota = 7;\nif (nota >= 5) {\n    System.out.println(\"Aprovat\");\n} else {\n    System.out.println(\"Suspès\");\n}\nint n1 = 7;\nif (n1 % 2 == 0) {\n    System.out.println(\"Es Parell\");\n} else {\n    System.out.println(\"Es Senar\");\n}", "input": null, "out": "Aprovat\nEs Senar", "expect": null, "check": true}, {"k": "p", "v": "L'`else` és opcional: si no hi és i la condició és falsa, no es fa res."}], "refs": "Exemple1.java, Exercici2.java, Exercici6.java"}, {"t": "La cadena if / else if / else", "blocks": [{"k": "p", "v": "Quan hi ha diversos casos, es comproven en ordre i només s'executa el primer bloc amb la condició certa. L'`else` final recull tota la resta."}, {"k": "code", "label": "Exemple2.java", "code": "int nota = 6;\nif (nota < 5) {\n    System.out.println(\"INSUFICIENT\");\n} else if (nota < 6) {\n    System.out.println(\"SUFICIENT\");\n} else if (nota < 7) {\n    System.out.println(\"Be\");\n} else if (nota < 9) {\n    System.out.println(\"NOTABLE\");\n} else if (nota < 10) {\n    System.out.println(\"Excel·lent\");\n} else {\n    System.out.println(\"MH\");\n}", "input": null, "out": "Be", "expect": null, "check": true}, {"k": "tip", "v": "A cada `else if` no cal tornar a dir `nota >= 6`: si hem arribat fins allà és perquè les condicions anteriors eren falses."}, {"k": "warn", "v": "L'ordre importa. A Exercici3 primer es mira «múltiple de 2 i de 5» i després «múltiple de 2». Si fos al revés, el 10 diria només «múltiple de 2»."}], "refs": "Exemple2.java, Exercici3.java, Exercici2.java (Nivell3)"}, {"t": "Condicionals niats", "blocks": [{"k": "p", "v": "Un if pot anar dins d'un altre. A Exercici12 (sumar un segon a una hora), només es mira si els minuts arriben a 60 quan els segons ja hi han arribat:"}, {"k": "code", "label": "Exercici12.java", "code": "int hores = 23, minuts = 59, segons = 59;\nsegons++;\nif (segons == 60) {\n    segons = 0;\n    minuts++;\n    if (minuts == 60) {\n        minuts = 0;\n        hores++;\n        if (hores == 24) {\n            hores = 0;\n        }\n    }\n}\nSystem.out.println(hores + \":\" + minuts + \":\" + segons);", "input": null, "out": "0:0:0", "expect": null, "check": true}], "refs": "Exercici12.java, Exercici11_A2.java, Exercici5AmbFuncio.java"}, {"t": "switch", "blocks": [{"k": "p", "v": "El `switch` compara una variable amb diversos valors. És l'estructura adequada per a un menú d'opcions."}, {"k": "code", "label": "Exercici4Switch.java", "code": "int numero = 3;\nswitch (numero) {\n    case 1:\n        System.out.println(\"Dilluns\");\n        break;\n    case 2:\n        System.out.println(\"Dimarts\");\n        break;\n    case 3:\n        System.out.println(\"Dimecres\");\n        break;\n    default:\n        System.out.println(\"no coincideix\");\n}", "input": null, "out": "Dimecres", "expect": null, "check": true}, {"k": "ul", "v": ["`case valor:` és el codi que s'executa si la variable té aquest valor.", "`break` surt del switch. Sense `break`, continua executant els case de sota.", "`default` s'executa si no coincideix cap case. És opcional.", "Es pot fer switch amb `int`, `char` (`case 's':`) i `String` (`case \"soci\":`)."]}, {"k": "warn", "v": "Si oblides el `break`, el programa «cau» al case següent:"}, {"k": "code", "label": "Sense break", "code": "int numero = 2;\nswitch (numero) {\n    case 1:\n        System.out.println(\"Dilluns\");\n    case 2:\n        System.out.println(\"Dimarts\");\n    case 3:\n        System.out.println(\"Dimecres\");\n        break;\n    default:\n        System.out.println(\"no coincideix\");\n}", "input": null, "out": "Dimarts\nDimecres", "expect": null, "check": true}], "refs": "Exercici4Switch.java, EjercicioString2.java, Exercici2Millor.java"}, {"t": "Diversos valors al mateix case", "blocks": [{"k": "p", "v": "Hi ha dues maneres d'agrupar valors: posar diversos `case` seguits o separar-los amb comes."}, {"k": "code", "label": "ExerciciA2B23.java", "code": "int mes = 4;\nint numeroDies = 0;   // 0 = mes incorrecte\nswitch (mes) {\n    case 1, 3, 5, 7, 8, 10, 12:\n        numeroDies = 31;\n        break;\n    case 2:\n        numeroDies = 28;\n        break;\n    case 4, 6, 9, 11:\n        numeroDies = 30;\n}\nSystem.out.println(numeroDies);", "input": null, "out": "30", "expect": null, "check": true}, {"k": "p", "v": "L'equivalent amb case seguits és `case 6: case 7: System.out.println(\"festiu\"); break;` (Exercici4Switch)."}], "refs": "ExerciciA2B23.java, Exercici4Switch.java, Exercici11_A2.java"}, {"t": "switch amb Strings i amb char", "blocks": [{"k": "code", "label": "Exercici2Millor.java", "code": "String tipusClient = \"Premium\";\ndouble descompte = -1;            // -1 = client incorrecte\nswitch (tipusClient.toLowerCase()) {\n    case \"general\": descompte = 0;   break;\n    case \"soci\":    descompte = 0.1; break;\n
