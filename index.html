ots passar a l'establiment\");\n}", "input": null, "out": "Pots passar a l'establiment", "expect": null, "check": true}, {"k": "tip", "v": "Amb un boolean no cal posar `== true`: `if (entrada)` ja vol dir «si entrada és cert». I `if (!entrada)` vol dir «si és fals»."}], "refs": "Exercisi1.java, Activitat2.java, Exercici3A5.java"}, {"t": "Prioritat: primer ! , després && i al final ||", "blocks": [{"k": "p", "v": "Igual que la multiplicació es fa abans que la suma, el `&&` es fa abans que el `||`. Per evitar confusions, posa parèntesis."}, {"k": "code", "label": "Activitat2.java", "code": "int hora = 23, temp = 25;\ndouble litres = 3.0;\nboolean bici = (hora < 21 || temp >= 20 && litres < 0.5);\nSystem.out.println(bici);\nboolean horaTemp = !(hora > 22 || temp < 5);\nSystem.out.println(horaTemp);", "input": null, "out": "false\nfalse", "expect": null, "check": true}, {"k": "p", "v": "La línia de la bici es llegeix com `hora < 21 || (temp >= 20 && litres < 0.5)`. Com que `hora < 21` és fals i la segona part també (plou 3 litres), el resultat és `false`."}], "refs": "Activitat2.java"}, {"t": "Condicions combinades (el museu)", "blocks": [{"k": "code", "label": "Exercici3A5.java", "code": "boolean estudiant = true;\nint edat = 22;\nboolean professor = false, vaAmbGrupClasse = false;\nboolean potEntrarSensePagar = (estudiant && edat < 25) || (professor && vaAmbGrupClasse);\nif (!potEntrarSensePagar) {\n    System.out.println(\"No pots entrar gratuïtament al museu.\");\n} else {\n    System.out.println(\"Pots entrar gratuïtament al museu.\");\n}", "input": null, "out": "Pots entrar gratuïtament al museu.", "expect": null, "check": true}], "refs": "Exercici3A5.java"}, {"t": "Negar una condició (lleis de De Morgan)", "blocks": [{"k": "p", "v": "Quan poses un `!` davant d'un parèntesi, en negar-ho tot s'inverteix cada comparació i el `&&` passa a `||` (i al revés):"}, {"k": "table", "head": ["Expressió", "Equival a"], "rows": [["`!(a && b)`", "`!a || !b`"], ["`!(a || b)`", "`!a && !b`"], ["`!(hora > 22 || temp < 5)`", "`hora <= 22 && temp >= 5`"], ["`!(x == 3)`", "`x != 3`"]]}, {"k": "warn", "v": "La negació de `>` és `<=` (no `<`). La de `<` és `>=`."}], "refs": "Activitat2.java, Exercici3A5.java"}, {"t": "Avaluació en curtcircuit", "blocks": [{"k": "p", "v": "Java deixa d'avaluar quan ja sap el resultat: amb `&&`, si la primera part és falsa, la segona no es mira; amb `||`, si la primera és certa, tampoc."}, {"k": "code", "label": "Curtcircuit", "code": "int x = 0;\nif (x != 0 && 10 / x > 1) {\n    System.out.println(\"gran\");\n} else {\n    System.out.println(\"x és zero o petit\");\n}", "input": null, "out": "x és zero o petit", "expect": null, "check": true}, {"k": "tip", "v": "Com que `x != 0` és fals, no s'arriba a fer `10 / x`, que donaria error (divisió per zero)."}], "refs": ""}]}, {"tema": "bucles", "intro": "Un bucle repeteix un bloc de codi mentre es compleixi una condició. N'hi ha tres: `for`, `while` i `do-while`.", "secs": [{"t": "Quin bucle fer servir?", "blocks": [{"k": "table", "head": ["Bucle", "Quan fer-lo servir", "Exemple del curs"], "rows": [["`for`", "Saps quantes vegades s'ha de repetir", "La taula de multiplicar (Exercici14)"], ["`while`", "Es repeteix mentre passi alguna cosa; pot no executar-se cap vegada", "Comptar xifres (Exercisi8)"], ["`do-while`", "S'ha d'executar almenys una vegada (menús, demanar dades)", "Demanar notes fins a -1 (Exercici11)"]]}], "refs": ""}, {"t": "El bucle for", "blocks": [{"k": "p", "v": "Té tres parts separades per `;`: la inicialització (es fa un cop), la condició (es mira abans de cada volta) i l'increment (es fa al final de cada volta)."}, {"k": "code", "label": "Exemple.java", "code": "for (int i = 0; i < 5; i++) {\n    System.out.println(i + \" - Hola\");\n}", "input": null, "out": "0 - Hola\n1 - Hola\n2 - Hola\n3 - Hola\n4 - Hola", "expect": null, "check": true}, {"k": "tip", "v": "`for (int i = 0; i < 5; i++)` fa 5 voltes (de 0 a 4). `for (int i = 1; i <= 5; i++)` també en fa 5, però de 1 a 5."}, {"k": "p", "v": "També es pot comptar cap enrere o de n en n: `for (int i = n1; i >= 1; i--)` (Exercici4, divisors) o `i += 2`."}, {"k": "code", "label": "Exercici14.java", "code": "int numero = 3;\nfor (int i = 1; i <= 4; i++) {\n    System.out.println(numero + \" * \" + i + \" = \" + (numero * i));\n}", "input": null, "out": "3 * 1 = 3\n3 * 2 = 6\n3 * 3 = 9\n3 * 4 = 12", "expect": null, "check": true}], "refs": "Exemple.java, Exercici14.java, Exercici4.java"}, {"t": "El bucle while", "blocks": [{"k": "p", "v": "Mira la condició abans de cada volta. Si d'entrada és falsa, no s'executa cap vegada. Dins del bucle alguna cosa ha de fer que la condició acabi sent falsa."}, {"k": "code", "label": "Exercisi8.java", "code": "int numero = 4507;\nint numeroClon = numero;\nint xifres = 0;\nwhile (numeroClon > 0) {\n    numeroClon = numeroClon / 10;   // treu l'última xifra\n    xifres++;\n}\nSystem.out.println(\"El numero \" + numero + \" te \" + xifres + \" xifres\");", "input": null, "out": "El numero 4507 te 4 xifres", "expect": null, "check": true}, {"k": "tip", "v": "Es treballa amb una còpia (`numeroClon`) per no perdre el número original, que després es vol mostrar."}, {"k": "warn", "v": "Si oblides la línia que canvia la variable de la condició (per exemple el `i++`), el bucle no s'acaba mai: és un bucle infinit."}], "refs": "Exercisi8.java, Exercisi9.java, Exemple.java"}, {"t": "El bucle do-while", "blocks": [{"k": "p", "v": "Primer executa el bloc i després mira la condició. Per això sempre fa almenys una volta. Porta punt i coma al final: `} while (condició);`."}, {"k": "code", "label": "Exercici11.java", "code": "Scanner teclat = new Scanner(System.in);\nint aprovats = 0, suspesos = 0;\nint nota;\ndo {\n    nota = teclat.nextInt();\n    if (nota >= 5 && nota <= 10) {\n        aprovats++;\n    } else if (nota >= 0 && nota < 5) {\n        suspesos++;\n    }\n} while (nota != -1);\nSystem.out.println(aprovats + \" aprovats, \" + suspesos + \" suspesos\");", "input": "7\\n3\\n9\\n-1", "out": "2 aprovats, 1 suspesos", "expect": null, "check": true}, {"k": "warn", "v": "La variable de la condició (`nota`) s'ha de declarar abans del `do`. Si es declara a dins, al `while` ja no existeix i no compila."}], "refs": "Exercici11.java, Exercici16.java"}, {"t": "Valor sentinella", "blocks": [{"k": "p", "v": "És un valor especial que l'usuari escriu per dir «ja n'hi ha prou», com el -1 de les notes a Exercici11. No s'ha de comptar com una dada: per això la condició `nota >= 0` deixa fora el -1."}, {"k": "p", "v": "Una variant és preguntar si vol continuar (Exercici16): `while (!resposta.equalsIgnoreCase(\"N\"))`."}], "refs": "Exercici11.java, Exercici16.java, Exercici10.java"}, {"t": "Comptadors i acumuladors", "blocks": [{"k": "p", "v": "Dins dels bucles es fan servir dos tipus de variables, que s'inicialitzen abans del bucle (normalment a 0):"}, {"k": "ul", "v": ["Comptador: suma 1 cada vegada que passa una cosa → `xifres++`, `aprovats++`.", "Acumulador: va sumant valors → `suma += num`."]}, {"k": "code", "label": "Mitjana (Exercici10)", "code": "int suma = 0, contador = 0;\nfor (int i = 1; i <= 4; i++) {\n    suma += i;      // acumulador\n    contador++;     // comptador\n}\nSystem.out.println(\"Suma: \" + suma);\nSystem.out.println(\"Mitjana: \" + (double) suma / contador);", "input": null, "out": "Suma: 10\nMitjana: 2.5", "expect": null, "check": true}, {"k": "warn", "v": "Si inicialitzes l'acumulador dins del bucle, es posa a 0 a cada volta i al final només té l'últim valor."}], "refs": "Exercici10.java, Exercici11.java, Exercici18A6.java"}, {"t": "Bucles niats", "blocks": [{"k": "p", "v": "Un bucle dins d'un altre. Per cada volta del de fora, el de dins fa totes les seves voltes. És la manera de dibuixar figures (Exercici26):"}, {"k": "code", "label": "Exercici26.java", "code": "int files = 4;\nfor (int i = 1; i <= files; i++) {      // i = fila\n    for (int j = 0; j < i; j++) {       // j dibuixa les lletres de la fila i\n        System.out.print(\"+\");\n    }\n    System.out.println();               // salt de línia en acabar la fila\n}", "input": null, "out": "+\n++\n+++\n++++", "expect": null, "check": true}, {"k": "tip", "v": "Per al triangle invertit, primer un bucle dibuixa `files - i` espais i després un altre els caràcters."}], "refs": "Exercici26.java, Exercici12.java (bucles)"}, {"t": "Recórrer les xifres d'un número", "blocks": [{"k": "p", "v": "Patró molt freqüent: `% 10` dona l'última xifra i `/ 10` la treu. Es repeteix mentre el número sigui més gran que 0."}, {"k": "code", "label": "Suma de xifres", "code": "int n = 352;\nint suma = 0;\nwhile (n > 0) {\n    suma += n % 10;\n    n = n / 10;\n}\nSystem.out.println(suma);", "input": null, "out": "10", "expect": null, "check": true}], "refs": "Exercisi8.java, Exercisi9.java, ExerciciExtra2.java"}]}, {"tema": "funcions", "intro": "Una funció és un tros de codi amb nom que fa una tasca. Es defineix un cop i es pot cridar tantes vegades com calgui. Així no es repeteix codi i el `main` queda més clar.", "secs": [{"t": "Parts d'una funció", "blocks": [{"k": "code", "label": "Exercici4.java", "code": "public static void escriureDivisors(int n1) {\n    System.out.print(\"Divisors positius: \");\n    for (int i = n1; i >= 1; i--) {\n        if (n1 % i == 0) {\n            System.out.print(i + \" - \");\n        }\n    }\n}\n\npublic static void main(String[] args) {\n    escriureDivisors(12);\n}", "input": null, "out": "Divisors positius: 12 - 6 - 4 - 3 - 2 - 1 -", "expect": null, "check": true}, {"k": "table", "head": ["Part", "Exemple", "Què vol dir"], "rows": [["`public static`", "`public static`", "Al curs totes les funcions van així"], ["Tipus de retorn", "`void`, `int`, `String`...", "Què torna la funció (`void` = no torna res)"], ["Nom", "`escriureDivisors`", "En minúscula i amb un verb: diu què fa"], ["Paràmetres", "`(int n1)`", "Les dades que rep, amb el seu tipus"]]}], "refs": "Exercici4.java, Exercici26.java"}, {"t": "void o amb return", "blocks": [{"k": "p", "v": "Una funció `void` fa alguna cosa (per exemple, escriure per pantalla) però no torna cap valor. Una funció amb tipus (`int`, `double`, `String`...) calcula un valor i el torna amb `return`."}, {"k": "code", "label": "Exercici16.java (amb funcions)", "code": "public static int sumar(int a, int b) {\n    int resultat = a + b;\n    return resultat;\n}\n\npublic static void saludar(String nom) {\n    System.out.println(\"Hola \" + nom);\n}\n\npublic static void main(String[] args) {\n    int s = sumar(3, 4);\n    saludar(\"món\");\n    System.out.println(s);\n}", "input": null, "out": "Hola món\n7", "expect": null, "check": true}, {"k": "warn", "v": "Si una funció diu que retorna un `int` però no té `return`, no compila. És l'error de `llegirNumero` a Exercisi1 (Booleans): fa `teclat.nextInt();` però hauria de ser `return teclat.nextInt();`."}, {"k": "p", "v": "El `return` acaba la funció a l'instant. El que hi hagi després no s'executa."}], "refs": "Exercici16.java, Exercisi1.java (Booleans), Exercici5AmbFuncio.java"}, {"t": "Cridar una funció", "blocks": [{"k": "ul", "v": ["Els valors que passes s'han de correspondre amb els paràmetres, en el mateix ordre i tipus: `sumar(3, 4)`.", "El valor que torna es pot guardar (`int s = sumar(3, 4);`) o fer servir directament (`System.out.println(sumar(3, 4));`).", "Una funció `void` es crida sola, en una línia: `escriureDivisors(12);`.", "Per cridar una funció d'una altra classe s'escriu el nom de la classe davant: `Utils.llegirEnter(\"Edat: \")`."]}], "refs": ""}, {"t": "Variables locals i static", "blocks": [{"k": "p", "v": "Les variables declarades dins d'una funció (i els paràmetres) només existeixen dins d'aquesta funció. Si un valor s'ha de compartir entre totes les funcions de la classe, es declara fora, amb `static`. Per això el Scanner va fora del main:"}, {"k": "code", "label": "Utils.java", "code": "import java.util.Scanner;\n\npublic class Utils {\n    static Scanner teclat = new Scanner(System.in);\n\n    public static int llegirEnter(String missatge) {\n        System.out.print(missatge);\n        return teclat.nextInt();\n    }\n}", "input": null, "out": null, "expect": null, "check": false}], "refs": "Utils.java, Exercici5AmbFuncio.java"}, {"t": "La llibreria Utils", "blocks": [{"k": "p", "v": "`Utils.java` és una classe que només conté funcions útils. Ha d'estar a la mateixa carpeta que el programa que la fa servir. Les funcions que té:"}, {"k": "ul", "v": ["`llegirEnter`, `llegirDecimal`, `llegirChar`, `llegirString`, `llegirFrase`: mostren un missatge i tornen el que escriu l'usuari.", "`borrarPantalla()`: és `void`, només neteja la consola.", "`generarNumeroAleatori(minim, maxim)`: torna un enter aleatori entre els dos valors."]}, {"k": "tip", "v": "No cal repetir `llegirEnter()` a cada programa: s'escriu un cop a Utils i es crida des de qualsevol programa."}], "refs": "Utils.java"}, {"t": "Funcions que tornen boolean", "blocks": [{"k": "p", "v": "Una funció pot tornar `true` o `false`. Són útils per fer condicions que es llegeixen com una frase:"}, {"k": "code", "label": "Funció boolean", "code": "public static boolean esParell(int n) {\n    return n % 2 == 0;\n}\n\npublic static void main(String[] args) {\n    if (esParell(8)) {\n        System.out.println(\"8 és parell\");\n    }\n    System.out.println(esParell(5));\n}", "input": null, "out": "8 és parell\nfalse", "expect": null, "check": true}, {"k": "tip", "v": "`return n % 2 == 0;` ja torna el boolean. No cal fer `if (n % 2 == 0) return true; else return false;`."}], "refs": ""}]}, {"tema": "errors", "intro": "Hi ha tres tipus d'errors. Saber-los distingir és clau per a les preguntes de «què passa amb aquest codi?».", "secs": [{"t": "Els tres tipus d'error", "blocks": [{"k": "table", "head": ["Tipus", "Quan passa", "Exemple"], "rows": [["De compilació", "El codi no segueix les normes de Java i no arriba a executar-se", "Falta un `;`, variable no declarada, tipus incompatibles"], ["D'execució", "Compila, però el programa peta mentre s'executa (Exception)", "`charAt` fora de rang, dividir un int per 0, escriure lletres a `nextInt()`"], ["De lògica", "Compila i s'executa, però el resultat és incorrecte", "`n % 2 == 1` per dir «parell», `10 / 100` que dona 0"]]}], "refs": ""}, {"t": "Errors de compilació típics", "blocks": [{"k": "ul", "v": ["Falta el punt i coma `;` al final d'una instrucció.", "Fer servir una variable que no s'ha declarat, o escriure-la diferent (Java distingeix majúscules: `Nota` ≠ `nota`).", "Assignar un tipus que no hi cap: `int i = 13.13;`, `char c = \"a\";`.", "Canviar el valor d'una constant `final`.", "Fer servir una variable local que potser no té valor (Exemple1).", "Funció que ha de retornar un valor i no té `return` (Exercisi1 de Booleans).", "Claus `{ }` que no quadren.", "Falta l'`import java.util.Scanner;`.", "Comparar un String sense cometes: `tipusClient == premium`. Java pensa que `premium` és una variable que no existeix."]}, {"k": "code", "label": "Exemple d'error de tipus", "code": "int x = 5;\nString s = x;        // no compila: un int no és un String", "input": null, "out": null, "expect": "compile-error", "check": true}, {"k": "tip", "v": "Per convertir un número a String n'hi ha prou amb concatenar-lo: `String s = \"\" + x;`."}], "refs": "ProvaChar.java, ProvaConstant.java, Exemple1.java"}, {"t": "Errors d'execució típics", "blocks": [{"k": "code", "label": "Divisió per zero", "code": "int a = 10, b = 0;\nSystem.out.println(a / b);", "input": null, "out": null, "expect": "runtime-error", "check": true}, {"k": "ul", "v": ["`ArithmeticException`: dividir un enter entre 0.", "`StringIndexOutOfBoundsException`: `charAt(i)` amb una posició que no existeix (per exemple, `i <= s.length()`).", "`InputMismatchException`: l'usuari escriu text quan el programa fa `nextInt()`."]}, {"k": "tip", "v": "Un `double` dividit per 0 no peta: dona `Infinity`."}], "refs": ""}, {"t": "Errors de lògica típics del curs", "blocks": [{"k": "ul", "v": ["Condició al revés: `n % 2 == 1` per dir «parell».", "Divisió entera sense voler: `10 / 100` = 0 (Exercici8), `suma / contador` en una mitjana (Exercici10).", "`switch` sense `break`, que executa també els case de sota.", "Comparar amb majúscules diferents: `toLowerCase()` i després `case \"Arxiu\"`.", "Ordre incorrecte de la cadena `if / else if`: un cas general abans d'un de més concret.", "Bucle que no acaba mai, o que fa una volta de més o de menys (`<` en lloc de `<=`).", "Mostrar el resultat encara que la dada sigui incorrecta."]}], "refs": ""}, {"t": "Comparar Strings amb ==", "blocks": [{"k": "p", "v": "Per comparar el text de dos Strings s'ha de fer servir `.equals()`. L'operador `==` mira si són el mateix objecte, i amb textos llegits del teclat sovint dona `false` encara que el text sigui igual."}, {"k": "code", "label": "equals", "code": "String a = \"hola\";\nString b = new String(\"hola\");\nSystem.out.println(a == b);\nSystem.out.println(a.equals(b));", "input": null, "out": "false\ntrue", "expect": null, "check": true}, {"k": "tip", "v": "Al curs, els exercicis de Strings (Exercici16, Exercici1 de Strings...) sempre fan servir `equals` o `equalsIgnoreCase`."}], "refs": ""}, {"t": "Com llegir un error del compilador", "blocks": [{"k": "p", "v": "Quan un programa no compila, Java indica el fitxer, la línia i el problema. Per exemple: `Exemple1.java:6: error: variable nom might not have been initialized`."}, {"k": "ul", "v": ["El número després dels dos punts és la línia de l'error.", "`cannot find symbol` → variable o funció no declarada, o mal escrita.", "`incompatible types` → el tipus no quadra (`possible lossy conversion from double to int`).", "`';' expected` → falta un punt i coma.", "`missing return statement` → la funció no retorna res.", "`cannot assign a value to final variable` → s'intenta canviar una constant."]}], "refs": ""}]}, {"tema": "practiques", "intro": "Un programa no només ha de funcionar: ha d'estar ben estructurat. Aquestes són les pautes que segueixen les solucions del curs.", "secs": [{"t": "Fer servir l'estructura adequada", "blocks": [{"k": "p", "v": "Cada situació té la seva estructura de control. Fer servir la que toca fa el codi més clar i més curt."}, {"k": "table", "head": ["Situació", "Estructura adequada"], "rows": [["Un menú d'opcions numerades", "`switch`"], ["Trams o intervals (notes, temperatures)", "`if / else if / else`"], ["Repetir un nombre conegut de vegades", "`for`"], ["Repetir fins que l'usuari vulgui / dada vàlida", "`while` o `do-while`"]]}], "refs": "Exercici4Switch.java, Exemple2.java, Exercici14.java, Exercici11.java"}, {"t": "Primer calcular, després mostrar", "blocks": [{"k": "p", "v": "El switch (o la cadena d'if) només calcula el resultat i el guarda en una variable. Després, un sol bloc al final decideix què es mostra."}, {"k": "code", "label": "Solució Exercici1.java (menú de plats)", "code": "int numeroPlat = 5;\nString nomPlat = \"\";        // variable que guarda el resultat\nswitch (numeroPlat) {\n    case 1: nomPlat = \"Pizza\";       break;\n    case 2: nomPlat = \"Hamburguesa\"; break;\n    case 3: nomPlat = \"Amanida\";     break;\n    case 4: nomPlat = \"Pasta\";       break;\n}\nif (nomPlat.isEmpty()) {\n    System.out.println(\"Nom del plat incorrecte !!\");\n} else {\n    System.out.println(\"Has escollit: \" + nomPlat);\n}", "input": null, "out": "Nom del plat incorrecte !!", "expect": null, "check": true}, {"k": "tip", "v": "Així els missatges són en un sol lloc i és fàcil afegir el cas de dada incorrecta."}], "refs": "Solució/Exercici1.java"}, {"t": "Un valor especial per a «incorrecte»", "blocks": [{"k": "p", "v": "Per saber al final si la dada era vàlida, la variable del resultat comença amb un valor que no pot ser un resultat correcte:"}, {"k": "ul", "v": ["`String nomPlat = \"\";` → si continua buit, el plat no existia (`isEmpty()`).", "`double descompte = -1;` → un descompte negatiu indica client incorrecte.", "`int numeroDies = 0;` → cap mes té 0 dies (ExerciciA2B23)."]}, {"k": "tip", "v": "Sempre s'ha de tractar el cas de la dada incorrecta: el programa ha de dir-ho, no mostrar un resultat sense sentit."}], "refs": "Solució/Exercici1.java, Exercici2Millor.java, ExerciciA2B23.java"}, {"t": "Demanar dades només quan calen", "blocks": [{"k": "p", "v": "A Exercici2Millor, el preu de la compra només es demana si el tipus de client és vàlid. Si no ho és, es mostra l'error i prou."}, {"k": "code", "label": "Exercici2Millor.java", "code": "String tipusClient = \"Soci\";\ndouble preuCompra = 50;\ndouble descompte = -1;\nswitch (tipusClient.toLowerCase()) {\n    case \"general\": descompte = 0;   break;\n    case \"soci\":    descompte = 0.1; break;\n    case \"premium\": descompte = 0.2; break;\n    case \"vip\":     descompte = 0.3; break;\n}\nif (descompte == -1) {\n    System.out.println(\"Tipus client no vàlid !!!!\");\n} else {\n    double descompteCompra = preuCompra * descompte;\n    System.out.println(\"Descompte: \" + descompteCompra);\n    System.out.println(\"Preu final: \" + (preuCompra - descompteCompra));\n}", "input": null, "out": "Descompte: 5.0\nPreu final: 45.0", "expect": null, "check": true}], "refs": "Exercici2Millor.java"}, {"t": "Una sola variable, no una per cas", "blocks": [{"k": "p", "v": "En lloc de tenir `descompteSoci`, `descomptePremium`, `descompteVip`..., es fa servir una sola variable `descompte` a la qual el switch assigna 0, 0.1, 0.2 o 0.3. Després el càlcul es fa una sola vegada."}, {"k": "p", "v": "El mateix passa amb el codi repetit: si cada case demana el preu i mostra el resultat, el programa és més llarg i qualsevol canvi s'ha de fer a tots els llocs."}], "refs": ""}, {"t": "El tipus de dada correcte", "blocks": [{"k": "p", "v": "Un tipus de client («general», «soci»...) és un text, per tant ha de ser un `String` i els valors s'escriuen entre cometes: `case \"premium\":`."}, {"k": "warn", "v": "Sense cometes, `tipusClient == premium` no compila: Java pensa que `premium` és una variable que no existeix."}], "refs": "Exercici2Millor.java"}, {"t": "Noms, constants i comentaris", "blocks": [{"k": "ul", "v": ["Les variables tenen noms que expliquen què guarden, en minúscula i amb cada paraula nova en majúscula: `preuCompra`, `tipusClient`, `numeroPlat`.", "Les constants van amb `final` i en MAJÚSCULES: `CONV_SEGONS_HORA`.", "Els comentaris (`//`, `/* */`) expliquen què fa cada part. Java els ignora.", "Les funcions comunes (llegir dades...) s'escriuen un cop a `Utils` i es criden des de qualsevol programa."]}], "refs": "Exercici13.java, Utils.java"}, {"t": "Llista de comprovació", "blocks": [{"k": "ul", "v": ["El programa mostra el menú o els missatges que demana l'enunciat? Prova'l!", "Has tractat el cas de dada incorrecta?", "Fas servir l'estructura adequada (switch per a menús)?", "Calcules primer i mostres al final, en un sol lloc?", "Els textos són String i es comparen amb `equals` / `equalsIgnoreCase`?", "Fas servir la llibreria Utils en lloc de repetir funcions?", "Els noms de variables expliquen què guarden? Les constants van amb `final` i en MAJÚSCULES?", "El programa està acabat: demana totes les dades i mostra tots els resultats que es demanen."]}], "refs": ""}]}];

/* ---------- helpers ---------- */
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

var KW = "public|private|static|void|int|double|char|boolean|final|if|else|switch|case|break|default|for|while|do|return|new|class|import|true|false|null|long";
var RE = new RegExp('(\\/\\/.*$)|("(?:\\\\.|[^"\\\\])*")|(\'(?:\\\\.|[^\'\\\\])\')|\\b(\\d+(?:\\.\\d+)?)\\b|\\b(' + KW + ')\\b|\\b(String|Scanner|System|Math|Utils|Random|Boolean)\\b|([A-Za-z_]\\w*)(?=\\s*\\()', "gm");

// Numbered fixed tests: balanced mix of all topics, deterministic.
var TESTS = (function () {
  var rnd = seeded(20261116);
  var lists = Object.keys(TEMES).map(function (t) { return sshuffle(BY_TEMA[t] || [], rnd); });
  var order = [];
  var any = true;
  while (any) { any = false; lists.forEach(function (l) { if (l.length) { order.push(l.shift()); any = true; } }); }
  var n = Math.floor(order.length / TEST_SIZE), out = [];
  for (var i = 0; i < n; i++) out.push(order.slice(i * TEST_SIZE, (i + 1) * TEST_SIZE).map(function (q) { return q.id; }));
  var rest = order.slice(n * TEST_SIZE).map(function (q) { return q.id; });
  rest.forEach(function (id, k) { out[k % n].push(id); });

})();

// Prepare a question instance for a session: shuffle options (except V/F)
function inst(q) {

}
function genQ(tema) {
  var list = tema ? (GEN_BY_TEMA[tema] || []) : GEN.list;

}

/* ---------- stats ---------- */
function record(item, correct) {
  DB.tot.a++; if (correct) DB.tot.c++;
  if (correct) { DB.streak++; DB.best = Math.max(DB.best, DB.streak); } else DB.streak = 0;
  if (item.id !== null && item.id !== undefined) {
    var r = DB.q[item.id] || { c: 0, w: 0 };
    if (correct) r.c++; else r.w++;

}

  cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
  var cols = ["#8b6cff", "#22d3ee", "#22c55e", "#fbbf24", "#f472b6", "#ffffff"], P = [];

}
function closeDrawer() { ["drawer", "drawer-bg"].forEach(function (id) { var el = document.getElementById(id); if (el) el.remove(); }); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
app.addEventListener("input", function (e) { if (e.target.id === "thq") searchTheory(e.target.value); });

renderHome();
</script>
